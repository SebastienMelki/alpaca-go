components:
    schemas:
        FieldViolation:
            type: object
            properties:
                field:
                    type: string
                    description: The field path that failed validation (e.g., 'user.email' for nested fields). For header validation, this will be the header name (e.g., 'X-API-Key')
                description:
                    type: string
                    description: Human-readable description of the validation violation (e.g., 'must be a valid email address', 'required field missing')
            required:
                - field
                - description
            description: FieldViolation describes a single validation error for a specific field.
        ValidationError:
            type: object
            properties:
                violations:
                    type: array
                    items:
                        $ref: '#/components/schemas/FieldViolation'
                    description: List of validation violations
            required:
                - violations
            description: ValidationError is returned when request validation fails. It contains a list of field violations describing what went wrong.
        GetAccountRequest:
            type: object
            description: |-
                GetAccountRequest is the request to get the account.
                 Account is identified by the API key used for authentication.
        Account:
            type: object
            properties:
                id:
                    type: string
                    examples:
                        - 904837e3-3b76-47ec-b432-046db621571b
                    format: uuid
                    description: Account ID (UUID).
                    example: 904837e3-3b76-47ec-b432-046db621571b
                accountNumber:
                    type: string
                    examples:
                        - 010203ABCD
                    description: Account number.
                    example: 010203ABCD
                status:
                    type: string
                    examples:
                        - ACTIVE
                    enum:
                        -
                        - ONBOARDING
                        - SUBMISSION_FAILED
                        - SUBMITTED
                        - ACCOUNT_UPDATED
                        - APPROVAL_PENDING
                        - ACTIVE
                        - REJECTED
                        - DISABLED
                        - ACCOUNT_CLOSED
                    description: Account status.
                    example: ACTIVE
                cryptoStatus:
                    type: string
                    examples:
                        - ACTIVE
                    enum:
                        -
                        - INACTIVE
                        - ACTIVE
                    description: Crypto trading status.
                    example: ACTIVE
                currency:
                    type: string
                    examples:
                        - USD
                    description: Currency (USD).
                    example: USD
                buyingPower:
                    type: string
                    examples:
                        - 50000.00
                    description: Current available buying power (cash + margin).
                    example: 50000.00
                regtBuyingPower:
                    type: string
                    examples:
                        - 50000.00
                    description: Buying power for day trading (4x equity for pattern day traders).
                    example: 50000.00
                daytradingBuyingPower:
                    type: string
                    examples:
                        - 200000.00
                    description: Buying power for day trading (4x equity).
                    example: 200000.00
                effectiveBuyingPower:
                    type: string
                    examples:
                        - 50000.00
                    description: Effective buying power.
                    example: 50000.00
                nonMarginableBuyingPower:
                    type: string
                    examples:
                        - 50000.00
                    description: Non-marginable buying power.
                    example: 50000.00
                bodDtbp:
                    type: string
                    examples:
                        - 200000.00
                    description: Beginning of day day trading buying power.
                    example: 200000.00
                cash:
                    type: string
                    examples:
                        - 50000.00
                    description: Cash balance.
                    example: 50000.00
                accruedFees:
                    type: string
                    examples:
                        - 0.00
                    description: Accrued fees.
                    example: 0.00
                pendingTransferIn:
                    type: string
                    examples:
                        - 0.00
                    description: Pending transfer amount.
                    example: 0.00
                portfolioValue:
                    type: string
                    examples:
                        - 50000.00
                    description: Total portfolio value.
                    example: 50000.00
                patternDayTrader:
                    type: boolean
                    examples:
                        - false
                    description: Whether the account is a pattern day trader.
                    example: false
                tradingBlocked:
                    type: boolean
                    examples:
                        - false
                    description: Whether trading is blocked.
                    example: false
                transfersBlocked:
                    type: boolean
                    examples:
                        - false
                    description: Whether transfers are blocked.
                    example: false
                accountBlocked:
                    type: boolean
                    examples:
                        - false
                    description: Whether the account is blocked.
                    example: false
                createdAt:
                    type: string
                    examples:
                        - 2021-01-01T00:00:00Z
                    description: Timestamp when the account was created (RFC 3339).
                    example: 2021-01-01T00:00:00Z
                tradeSuspendedByUser:
                    type: boolean
                    examples:
                        - false
                    description: Whether trading is suspended by user.
                    example: false
                multiplier:
                    type: string
                    examples:
                        - 4
                    description: Margin multiplier.
                    example: 4
                shortingEnabled:
                    type: boolean
                    examples:
                        - true
                    description: Whether shorting is enabled.
                    example: true
                equity:
                    type: string
                    examples:
                        - 50000.00
                    description: Total equity.
                    example: 50000.00
                lastEquity:
                    type: string
                    examples:
                        - 50000.00
                    description: Last equity value.
                    example: 50000.00
                longMarketValue:
                    type: string
                    examples:
                        - 0.00
                    description: Long market value.
                    example: 0.00
                shortMarketValue:
                    type: string
                    examples:
                        - 0.00
                    description: Short market value.
                    example: 0.00
                positionMarketValue:
                    type: string
                    examples:
                        - 0.00
                    description: Position market value.
                    example: 0.00
                initialMargin:
                    type: string
                    examples:
                        - 0.00
                    description: Initial margin.
                    example: 0.00
                maintenanceMargin:
                    type: string
                    examples:
