        SubscribeFundingStatusV2Request:
            type: object
            properties:
                since:
                    type: string
                    examples:
                        - 2024-01-15
                    description: Starting date filter (YYYY-MM-DD).
                    example: 2024-01-15
                until:
                    type: string
                    examples:
                        - 2024-01-31
                    description: Ending date filter (YYYY-MM-DD).
                    example: 2024-01-31
                sinceId:
                    type: integer
                    format: int32
                    description: Starting event ID (integer, legacy).
                untilId:
                    type: integer
                    format: int32
                    description: Ending event ID (integer, legacy).
                sinceUlid:
                    type: string
                    examples:
                        - 01F7VQQ782DM57SJNWAYMD14J9
                    description: Starting event ID (ULID).
                    example: 01F7VQQ782DM57SJNWAYMD14J9
                untilUlid:
                    type: string
                    examples:
                        - 01F7VQQ782DM57SJNWAYMD14K0
                    description: Ending event ID (ULID).
                    example: 01F7VQQ782DM57SJNWAYMD14K0
            description: SubscribeFundingStatusV2Request is the request to subscribe to funding status events (v2).
        FundingStatusEventV2:
            type: object
            properties:
                eventId:
                    type: string
                    examples:
                        - 01F7VQQ782DM57SJNWAYMD14J9
                    description: Event ID (ULID format).
                    example: 01F7VQQ782DM57SJNWAYMD14J9
                at:
                    type: string
                    examples:
                        - 2025-04-11T19:52:24.066998Z
                    description: Timestamp of the status change.
                    example: 2025-04-11T19:52:24.066998Z
                accountId:
                    type: string
                    examples:
                        - 8e00606a-c9ac-409a-ba45-f55e8f77984a
                    format: uuid
                    description: Account UUID.
                    example: 8e00606a-c9ac-409a-ba45-f55e8f77984a
                correspondent:
                    type: string
                    examples:
                        - LPCA
                    description: Correspondent code.
                    example: LPCA
                entityId:
                    type: string
                    examples:
                        - c4ed4206-697b-4859-ab71-b9de6649859d
                    format: uuid
                    description: Entity UUID.
                    example: c4ed4206-697b-4859-ab71-b9de6649859d
                entityType:
                    type: string
                    examples:
                        - BankRelationship
                    description: Entity type (BankRelationship, WireBank, Transfer).
