components:
    schemas:
        FieldViolation:
            type: object
            properties:
                field:
                    type: string
                    description: The field path that failed validation (e.g., 'user.email' for nested fields). For header validation, this will be the header name (e.g., 'X-API-Key')
                description:
                    type: string
                    description: Human-readable description of the validation violation (e.g., 'must be a valid email address', 'required field missing')
            required:
                - field
                - description
            description: FieldViolation describes a single validation error for a specific field.
        ValidationError:
            type: object
            properties:
                violations:
                    type: array
                    items:
                        $ref: '#/components/schemas/FieldViolation'
                    description: List of validation violations
            required:
                - violations
            description: ValidationError is returned when request validation fails. It contains a list of field violations describing what went wrong.
        GetCryptoBarsRequest:
            type: object
            properties:
                loc:
                    type: string
                    examples:
                        - us
                    description: Crypto location (us).
                    example: us
                symbols:
                    type: string
                    examples:
                        - BTC/USD,ETH/USD
                    description: Comma-separated list of symbols (e.g., BTC/USD,ETH/USD).
                    example: BTC/USD,ETH/USD
                timeframe:
                    type: string
                    examples:
                        - 1Hour
                    description: Bar timeframe.
                    example: 1Hour
                start:
                    type: string
                    examples:
                        - 2024-01-01
                    description: Start timestamp (RFC 3339 or YYYY-MM-DD).
                    example: 2024-01-01
                end:
                    type: string
                    examples:
                        - 2024-01-31
                    description: End timestamp (RFC 3339 or YYYY-MM-DD).
                    example: 2024-01-31
                limit:
                    type: integer
                    examples:
                        - 1000
                    maximum: 10000
                    minimum: 1
                    format: int32
                    description: Maximum number of bars to return (1-10000, default 1000).
                    example: 1000
                pageToken:
                    type: string
                    examples:
                        - token123
                    description: Page token for pagination.
                    example: token123
                sort:
                    type: string
                    examples:
                        - asc
                    description: Sort order (asc, desc).
                    example: asc
            required:
                - symbols
                - timeframe
            description: GetCryptoBarsRequest is the request to get historical crypto bars.
        GetCryptoBarsResponse:
            type: object
            properties:
                bars:
                    type: object
                    additionalProperties:
                        type: array
                        items:
                            $ref: '#/components/schemas/CryptoBar'
                    description: Map of symbol to bars.
                next_page_token:
                    type: string
                    examples:
                        - YWJjZGVm
                    description: Next page token.
                    example: YWJjZGVm
            description: GetCryptoBarsResponse is the response containing crypto bars.
        BarsEntry:
            type: object
            properties:
                key:
                    type: string
                value:
                    $ref: '#/components/schemas/OptionBarsList'
        CryptoBarsList:
            type: array
            items:
                $ref: '#/components/schemas/CryptoBar'
            description: CryptoBarsList is a list of bars for a single symbol.
        CryptoBar:
            type: object
            properties:
                t:
                    type: string
                    examples:
                        - 2024-01-15T09:30:00Z
                    description: Timestamp (RFC 3339).
                    example: 2024-01-15T09:30:00Z
                o:
                    type: number
                    examples:
                        - 42000.00
                    format: double
                    description: Open price.
                    example: 42000.00
                h:
                    type: number
                    examples:
                        - 42500.00
                    format: double
                    description: High price.
                    example: 42500.00
                l:
                    type: number
                    examples:
                        - 41800.00
                    format: double
                    description: Low price.
                    example: 41800.00
                c:
                    type: number
                    examples:
                        - 42250.00
                    format: double
                    description: Close price.
                    example: 42250.00
                v:
                    type: number
                    examples:
                        - 123.456789
                    format: double
                    description: Volume.
                    example: 123.456789
                n:
                    type: integer
                    examples:
                        - 5432
                    format: int64
                    description: Number of trades.
                    example: 5432
                vw:
                    type: number
                    examples:
                        - 42150.00
                    format: double
                    description: Volume weighted average price.
                    example: 42150.00
            description: CryptoBar represents a crypto OHLCV bar.
        GetLatestCryptoBarsRequest:
            type: object
            properties:
                loc:
                    type: string
                    examples:
                        - us
                    description: Crypto location (us).
                    example: us
                symbols:
                    type: string
                    examples:
                        - BTC/USD,ETH/USD
                    description: Comma-separated list of symbols.
                    example: BTC/USD,ETH/USD
            required:
                - symbols
            description: GetLatestCryptoBarsRequest is the request to get the latest crypto bars.
        GetLatestCryptoBarsResponse:
            type: object
            properties:
                bars:
                    type: object
                    additionalProperties:
                        $ref: '#/components/schemas/CryptoBar'
                    description: Map of symbol to latest bar.
            description: GetLatestCryptoBarsResponse is the response containing the latest crypto bars.
        GetCryptoTradesRequest:
            type: object
            properties:
