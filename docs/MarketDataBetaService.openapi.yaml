    /v1beta1/options/snapshots/{underlying_symbol}:
        get:
            tags:
                - MarketDataBetaService
            summary: GetOptionChain
            description: |-
                GetOptionChain retrieves the option chain for an underlying.
                 GET /v1beta1/options/snapshots/{underlying_symbol}
            operationId: GetOptionChain
            parameters:
                - name: APCA-API-KEY-ID
                  in: header
                  description: Alpaca API key ID
                  required: true
                  schema:
                    type: string
                    example: PKXXXXXXXXXXXXXXXXXX
                - name: APCA-API-SECRET-KEY
                  in: header
                  description: Alpaca API secret key
                  required: true
                  schema:
                    type: string
                    example: XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                - name: underlying_symbol
                  in: path
                  description: Underlying symbol (bound from path variable).
                  required: true
                  schema:
                    type: string
                - name: feed
                  in: query
                  description: Data feed (indicative, opra).
                  required: false
                  schema:
                    type: string
                - name: type
                  in: query
                  description: Filter by option type (call, put).
                  required: false
                  schema:
                    type: string
                - name: strike_price_gte
                  in: query
                  description: Filter by strike price greater than or equal to.
                  required: false
                  schema:
                    type: number
                    format: double
                - name: strike_price_lte
                  in: query
                  description: Filter by strike price less than or equal to.
                  required: false
                  schema:
                    type: number
                    format: double
                - name: expiration_date_gte
                  in: query
                  description: Filter by expiration date greater than or equal to (YYYY-MM-DD).
                  required: false
                  schema:
                    type: string
                - name: expiration_date_lte
                  in: query
