        GetForexRatesRequest:
            type: object
            properties:
                currencyPairs:
                    type: string
                    examples:
                        - USDJPY,USDMXN
                    description: A comma-separated string with currency pairs (required).
                    example: USDJPY,USDMXN
                timeframe:
                    type: string
                    examples:
                        - 1Min
                    description: |-
                        The sampling interval of the currency rates.
                         Supported values: 5Sec, 5S, 1Min, 1T, 1Day, 1D.
                    example: 1Min
                start:
                    type: string
                    examples:
                        - 2024-01-03T00:00:00Z
                    description: 'The inclusive start of the interval. Format: RFC-3339 or YYYY-MM-DD.'
                    example: 2024-01-03T00:00:00Z
                end:
                    type: string
                    examples:
                        - 2024-01-04T00:00:00Z
                    description: 'The inclusive end of the interval. Format: RFC-3339 or YYYY-MM-DD.'
                    example: 2024-01-04T00:00:00Z
                limit:
                    type: integer
                    examples:
                        - 1000
                    maximum: 10000
                    minimum: 1
                    format: int32
                    description: Maximum number of data points to return (1-10000, default 1000).
                    example: 1000
                sort:
                    type: string
                    examples:
                        - asc
                    description: Sort data in ascending or descending order.
                    example: asc
                pageToken:
                    type: string
                    examples:
                        - token123
                    description: Pagination token for the next page.
                    example: token123
            required:
                - currencyPairs
            description: GetForexRatesRequest is the request to get historical forex rates.
        GetForexRatesResponse:
            type: object
