openapi: 3.1.0
info:
    title: MarketDataBetaService API
    version: 1.0.0
paths:
    /v1beta3/crypto/{loc}/bars:
        get:
            tags:
                - MarketDataBetaService
            summary: GetCryptoBars
            description: |-
                GetCryptoBars retrieves historical crypto bars.
                 GET /v1beta3/crypto/{loc}/bars
            operationId: GetCryptoBars
            parameters:
                - name: APCA-API-KEY-ID
                  in: header
                  description: Alpaca API key ID
                  required: true
                  schema:
                    type: string
                    example: PKXXXXXXXXXXXXXXXXXX
                - name: APCA-API-SECRET-KEY
                  in: header
                  description: Alpaca API secret key
                  required: true
                  schema:
                    type: string
                    example: XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                - name: loc
                  in: path
                  description: Crypto location (us).
                  required: true
                  schema:
                    type: string
                - name: symbols
                  in: query
                  description: Comma-separated list of symbols (e.g., BTC/USD,ETH/USD).
                  required: false
                  schema:
                    type: string
                - name: timeframe
                  in: query
                  description: Bar timeframe.
                  required: false
                  schema:
                    type: string
                - name: start
                  in: query
                  description: Start timestamp (RFC 3339 or YYYY-MM-DD).
                  required: false
                  schema:
                    type: string
                - name: end
                  in: query
                  description: End timestamp (RFC 3339 or YYYY-MM-DD).
                  required: false
                  schema:
                    type: string
                - name: limit
                  in: query
                  description: Maximum number of bars to return (1-10000, default 1000).
                  required: false
                  schema:
                    type: integer
                    format: int32
                - name: page_token
                  in: query
                  description: Page token for pagination.
                  required: false
                  schema:
                    type: string
                - name: sort
                  in: query
                  description: Sort order (asc, desc).
                  required: false
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetCryptoBarsResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    error:
                                        type: string
                                    code:
                                        type: integer
