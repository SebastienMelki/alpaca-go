components:
    schemas:
        Error:
            type: object
            properties:
                message:
                    type: string
                    description: Error message (e.g., 'user not found', 'database connection failed')
            description: Error is returned when a handler encounters an error. It contains a simple error message that the developer can customize.
        FieldViolation:
            type: object
            properties:
                field:
                    type: string
                    description: The field path that failed validation (e.g., 'user.email' for nested fields). For header validation, this will be the header name (e.g., 'X-API-Key')
                description:
                    type: string
                    description: Human-readable description of the validation violation (e.g., 'must be a valid email address', 'required field missing')
            required:
                - field
                - description
            description: FieldViolation describes a single validation error for a specific field.
        ValidationError:
            type: object
            properties:
                violations:
                    type: array
                    items:
                        $ref: '#/components/schemas/FieldViolation'
                    description: List of validation violations
            required:
                - violations
            description: ValidationError is returned when request validation fails. It contains a list of field violations describing what went wrong.
        GetStockBarsRequest:
            type: object
            properties:
                symbols:
                    type: string
                    examples:
                        - AAPL,TSLA,MSFT
                    description: Comma-separated list of symbols.
                    example: AAPL,TSLA,MSFT
                timeframe:
                    type: string
                    examples:
                        - 1Day
                    description: Bar timeframe (1Min, 5Min, 15Min, 30Min, 1Hour, 4Hour, 1Day, 1Week, 1Month).
                    example: 1Day
                start:
                    type: string
                    examples:
                        - 2024-01-01
                    description: Start timestamp (RFC 3339 or YYYY-MM-DD).
                    example: 2024-01-01
                end:
                    type: string
                    examples:
                        - 2024-01-31
                    description: End timestamp (RFC 3339 or YYYY-MM-DD).
                    example: 2024-01-31
                limit:
                    type: integer
                    examples:
                        - 1000
                    maximum: 10000
                    minimum: 1
                    format: int32
                    description: Maximum number of bars to return (1-10000, default 1000).
                    example: 1000
                adjustment:
                    type: string
                    examples:
                        - raw
                    description: Adjustment type (raw, split, dividend, all).
                    example: raw
                feed:
                    type: string
                    examples:
                        - sip
                    description: Data feed (iex, sip).
                    example: sip
                pageToken:
                    type: string
                    examples:
                        - token123
                    description: Page token for pagination.
                    example: token123
                sort:
                    type: string
                    examples:
                        - asc
                    description: Sort order (asc, desc).
                    example: asc
                asof:
                    type: string
                    examples:
                        - 2024-01-15
                    description: As-of date for symbol mapping (YYYY-MM-DD or "-" to skip mapping).
                    example: 2024-01-15
                currency:
                    type: string
                    examples:
                        - USD
                    description: Currency for response prices (ISO 4217).
                    example: USD
            required:
                - symbols
                - timeframe
            description: GetStockBarsRequest is the request to get historical stock bars.
        GetStockBarsResponse:
            type: object
            properties:
                bars:
                    type: object
                    additionalProperties:
                        type: array
                        items:
                            $ref: '#/components/schemas/Bar'
                    description: Map of symbol to bars.
                next_page_token:
                    type: string
                    examples:
                        - YWJjZGVm
                    description: Next page token.
                    example: YWJjZGVm
            description: GetStockBarsResponse is the response containing stock bars.
        BarsEntry:
            type: object
            properties:
                key:
                    type: string
                value:
                    $ref: '#/components/schemas/Bar'
