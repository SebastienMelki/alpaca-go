openapi: 3.1.0
info:
    title: BrokerService API
    version: 1.0.0
paths:
    /v1/accounts:
        get:
            tags:
                - BrokerService
            summary: ListAccounts
            description: |-
                ListAccounts retrieves a list of broker accounts.
                 GET /v1/accounts
            operationId: ListAccounts
            parameters:
                - name: Authorization
                  in: header
                  description: HTTP Basic Auth with base64 encoded API_KEY:API_SECRET
                  required: true
                  schema:
                    type: string
                    example: Basic QVBJLUtFWTpBUEktU0VDUkVU
                - name: query
                  in: query
                  description: Filter by query string (searches across fields).
                  required: false
                  schema:
                    type: string
                - name: created_after
                  in: query
                  description: Filter by creation date after (RFC 3339 or YYYY-MM-DD).
                  required: false
                  schema:
                    type: string
                - name: created_before
                  in: query
                  description: Filter by creation date before (RFC 3339 or YYYY-MM-DD).
                  required: false
                  schema:
                    type: string
                - name: status
                  in: query
                  description: Filter by account status.
                  required: false
                  schema:
                    type: string
                - name: sort
                  in: query
                  description: Sort order (asc, desc).
                  required: false
                  schema:
                    type: string
                - name: entities
                  in: query
                  description: Comma-separated list of entities to include (contact, identity, etc.).
                  required: false
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListAccountsResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
        post:
            tags:
                - BrokerService
            summary: CreateAccount
            description: |-
                CreateAccount creates a new broker-managed account.
                 POST /v1/accounts
            operationId: CreateAccount
            parameters:
                - name: Authorization
                  in: header
                  description: HTTP Basic Auth with base64 encoded API_KEY:API_SECRET
                  required: true
                  schema:
                    type: string
                    example: Basic QVBJLUtFWTpBUEktU0VDUkVU
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateAccountRequest'
                required: true
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/BrokerAccount'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /v1/accounts/{account_id}:
        get:
            tags:
                - BrokerService
            summary: GetAccount
            description: |-
                GetAccount retrieves a specific broker account.
                 GET /v1/accounts/{account_id}
            operationId: GetAccount
            parameters:
                - name: Authorization
                  in: header
                  description: HTTP Basic Auth with base64 encoded API_KEY:API_SECRET
                  required: true
                  schema:
                    type: string
                    example: Basic QVBJLUtFWTpBUEktU0VDUkVU
                - name: account_id
                  in: path
                  description: The account ID (bound from path variable).
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/BrokerAccount'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
        delete:
            tags:
                - BrokerService
            summary: CloseAccount
            description: |-
                CloseAccount closes a broker account.
                 DELETE /v1/accounts/{account_id}
            operationId: CloseAccount
            parameters:
                - name: Authorization
                  in: header
                  description: HTTP Basic Auth with base64 encoded API_KEY:API_SECRET
                  required: true
                  schema:
                    type: string
                    example: Basic QVBJLUtFWTpBUEktU0VDUkVU
                - name: account_id
                  in: path
                  description: The account ID (bound from path variable).
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CloseBrokerAccountResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
        patch:
            tags:
                - BrokerService
            summary: UpdateAccount
            description: |-
                UpdateAccount updates a broker account.
                 PATCH /v1/accounts/{account_id}
            operationId: UpdateAccount
            parameters:
                - name: Authorization
                  in: header
                  description: HTTP Basic Auth with base64 encoded API_KEY:API_SECRET
                  required: true
                  schema:
                    type: string
                    example: Basic QVBJLUtFWTpBUEktU0VDUkVU
                - name: account_id
                  in: path
                  description: The account ID (bound from path variable).
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateBrokerAccountRequest'
                required: true
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/BrokerAccount'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /v1/trading/accounts/{account_id}/account:
        get:
            tags:
                - BrokerService
            summary: GetTradingAccount
            description: |-
                GetTradingAccount retrieves the trading details for a broker account.
                 GET /v1/trading/accounts/{account_id}/account
            operationId: GetTradingAccount
            parameters:
                - name: Authorization
                  in: header
                  description: HTTP Basic Auth with base64 encoded API_KEY:API_SECRET
                  required: true
                  schema:
                    type: string
                    example: Basic QVBJLUtFWTpBUEktU0VDUkVU
                - name: account_id
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TradeAccount'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /v1/accounts/activities:
        get:
            tags:
                - BrokerService
            summary: ListAccountActivities
            description: |-
                ListAccountActivities retrieves account activities across all accounts.
                 GET /v1/accounts/activities
            operationId: ListAccountActivities
            parameters:
                - name: Authorization
                  in: header
                  description: HTTP Basic Auth with base64 encoded API_KEY:API_SECRET
                  required: true
                  schema:
                    type: string
                    example: Basic QVBJLUtFWTpBUEktU0VDUkVU
                - name: account_id
                  in: query
                  description: Filter by account ID.
                  required: false
                  schema:
                    type: string
                - name: activity_types
                  in: query
                  description: Filter by activity types (comma-separated).
                  required: false
                  schema:
                    type: string
                - name: category
                  in: query
                  description: Filter by category (trade_activity or non_trade_activity). Mutually exclusive with activity_types.
                  required: false
                  schema:
                    type: string
                - name: date
                  in: query
                  description: Filter by creation date (YYYY-MM-DD or RFC-3339).
                  required: false
                  schema:
                    type: string
                - name: until
                  in: query
                  description: Activities created before this date.
                  required: false
                  schema:
                    type: string
                - name: after
                  in: query
                  description: Activities created after this date.
                  required: false
                  schema:
                    type: string
                - name: direction
                  in: query
                  description: Chronological order (asc or desc).
                  required: false
                  schema:
                    type: string
                - name: page_size
                  in: query
                  description: Max entries per page (1-100, default 100).
                  required: false
                  schema:
                    type: integer
                    format: int32
                - name: page_token
                  in: query
                  description: Pagination token (ID of last activity from previous page).
                  required: false
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListAccountActivitiesResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /v1/accounts/activities/{activity_type}:
        get:
            tags:
                - BrokerService
            summary: ListAccountActivitiesByType
            description: |-
                ListAccountActivitiesByType retrieves account activities of a specific type.
                 GET /v1/accounts/activities/{activity_type}
            operationId: ListAccountActivitiesByType
            parameters:
                - name: Authorization
                  in: header
                  description: HTTP Basic Auth with base64 encoded API_KEY:API_SECRET
                  required: true
                  schema:
                    type: string
                    example: Basic QVBJLUtFWTpBUEktU0VDUkVU
                - name: activity_type
                  in: path
                  description: Activity type to filter by (path parameter).
                  required: true
                  schema:
                    type: string
                - name: account_id
                  in: query
                  description: Filter by account ID.
                  required: false
                  schema:
                    type: string
                - name: date
                  in: query
                  description: Filter by creation date (YYYY-MM-DD or RFC-3339).
                  required: false
                  schema:
                    type: string
                - name: until
                  in: query
                  description: Activities created before this date.
                  required: false
                  schema:
                    type: string
                - name: after
                  in: query
                  description: Activities created after this date.
                  required: false
                  schema:
                    type: string
                - name: direction
                  in: query
                  description: Chronological order (asc or desc).
                  required: false
                  schema:
                    type: string
                - name: page_size
                  in: query
                  description: Max entries per page (1-100, default 100).
                  required: false
                  schema:
                    type: integer
                    format: int32
                - name: page_token
                  in: query
                  description: Pagination token (ID of last activity from previous page).
                  required: false
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListAccountActivitiesResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /v1/trading/accounts/{account_id}/account/portfolio/history:
        get:
            tags:
                - BrokerService
            summary: GetBrokerPortfolioHistory
            description: |-
                GetBrokerPortfolioHistory retrieves portfolio history for a broker account.
                 GET /v1/trading/accounts/{account_id}/account/portfolio/history
            operationId: GetBrokerPortfolioHistory
            parameters:
                - name: Authorization
                  in: header
                  description: HTTP Basic Auth with base64 encoded API_KEY:API_SECRET
                  required: true
                  schema:
                    type: string
                    example: Basic QVBJLUtFWTpBUEktU0VDUkVU
                - name: account_id
                  in: path
                  description: Account ID (path parameter).
                  required: true
                  schema:
                    type: string
                - name: period
                  in: query
                  description: 'Period (1D, 1W, 1M, 3M, 1A, all, intraday). Default: 1M.'
                  required: false
                  schema:
                    type: string
                - name: timeframe
                  in: query
                  description: Timeframe for data points (1Min, 5Min, 15Min, 1H, 1D).
                  required: false
                  schema:
                    type: string
                - name: intraday_reporting
                  in: query
                  description: Intraday reporting mode (market_hours, extended_hours, continuous).
                  required: false
                  schema:
                    type: string
                - name: start
                  in: query
                  description: Start date/time (RFC-3339 or YYYY-MM-DD).
                  required: false
                  schema:
                    type: string
                - name: end
                  in: query
                  description: End date/time (RFC-3339 or YYYY-MM-DD).
                  required: false
                  schema:
                    type: string
                - name: pnl_reset
                  in: query
                  description: 'PnL reset mode for intraday queries (no_reset or per_day). Default: per_day.'
                  required: false
                  schema:
                    type: string
                - name: extended_hours
                  in: query
                  description: Whether to include extended hours data (deprecated, use intraday_reporting).
                  required: false
                  schema:
                    type: string
                - name: cashflow_types
                  in: query
                  description: Cashflow activities to include (ALL, NONE, or comma-separated activity types).
                  required: false
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/BrokerPortfolioHistory'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /v1/accounts/{account_id}/ach_relationships:
        get:
            tags:
                - BrokerService
            summary: ListACHRelationships
            description: |-
                ListACHRelationships retrieves ACH relationships for an account.
                 GET /v1/accounts/{account_id}/ach_relationships
            operationId: ListACHRelationships
            parameters:
                - name: Authorization
                  in: header
                  description: HTTP Basic Auth with base64 encoded API_KEY:API_SECRET
                  required: true
                  schema:
                    type: string
                    example: Basic QVBJLUtFWTpBUEktU0VDUkVU
                - name: account_id
                  in: path
                  description: The account ID (bound from path variable).
                  required: true
                  schema:
                    type: string
                - name: statuses
                  in: query
                  description: Filter by statuses (comma-separated).
                  required: false
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListACHRelationshipsResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
        post:
            tags:
                - BrokerService
            summary: CreateACHRelationship
            description: |-
                CreateACHRelationship creates an ACH relationship for an account.
                 POST /v1/accounts/{account_id}/ach_relationships
            operationId: CreateACHRelationship
            parameters:
                - name: Authorization
                  in: header
                  description: HTTP Basic Auth with base64 encoded API_KEY:API_SECRET
                  required: true
                  schema:
                    type: string
                    example: Basic QVBJLUtFWTpBUEktU0VDUkVU
                - name: account_id
                  in: path
                  description: The account ID (bound from path variable).
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateACHRelationshipRequest'
                required: true
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ACHRelationship'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /v1/accounts/{account_id}/ach_relationships/{ach_relationship_id}:
        delete:
            tags:
                - BrokerService
            summary: DeleteACHRelationship
            description: |-
                DeleteACHRelationship deletes an ACH relationship.
                 DELETE /v1/accounts/{account_id}/ach_relationships/{ach_relationship_id}
            operationId: DeleteACHRelationship
            parameters:
                - name: Authorization
                  in: header
                  description: HTTP Basic Auth with base64 encoded API_KEY:API_SECRET
                  required: true
                  schema:
                    type: string
                    example: Basic QVBJLUtFWTpBUEktU0VDUkVU
                - name: account_id
                  in: path
                  description: The account ID (bound from path variable).
                  required: true
                  schema:
                    type: string
                - name: ach_relationship_id
                  in: path
                  description: The ACH relationship ID (bound from path variable).
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DeleteACHRelationshipResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /v1/accounts/{account_id}/transfers:
        get:
            tags:
                - BrokerService
            summary: ListTransfers
            description: |-
                ListTransfers retrieves transfers for an account.
                 GET /v1/accounts/{account_id}/transfers
            operationId: ListTransfers
            parameters:
                - name: Authorization
                  in: header
                  description: HTTP Basic Auth with base64 encoded API_KEY:API_SECRET
                  required: true
                  schema:
                    type: string
                    example: Basic QVBJLUtFWTpBUEktU0VDUkVU
                - name: account_id
                  in: path
                  description: The account ID (bound from path variable).
                  required: true
                  schema:
                    type: string
                - name: direction
                  in: query
                  description: Filter by direction (INCOMING, OUTGOING).
                  required: false
                  schema:
                    type: string
                - name: limit
                  in: query
                  description: Filter by limit.
                  required: false
                  schema:
                    type: integer
                    format: int32
                - name: offset
                  in: query
                  description: Filter by offset.
                  required: false
                  schema:
                    type: integer
                    format: int32
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListTransfersResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
        post:
            tags:
                - BrokerService
            summary: CreateTransfer
            description: |-
                CreateTransfer creates a fund transfer for an account.
                 POST /v1/accounts/{account_id}/transfers
            operationId: CreateTransfer
            parameters:
                - name: Authorization
                  in: header
                  description: HTTP Basic Auth with base64 encoded API_KEY:API_SECRET
                  required: true
                  schema:
                    type: string
                    example: Basic QVBJLUtFWTpBUEktU0VDUkVU
                - name: account_id
                  in: path
                  description: The account ID (bound from path variable).
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateTransferRequest'
                required: true
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Transfer'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /v1/accounts/{account_id}/transfers/{transfer_id}:
        get:
            tags:
                - BrokerService
            summary: GetTransfer
            description: |-
                GetTransfer retrieves a specific transfer.
                 GET /v1/accounts/{account_id}/transfers/{transfer_id}
            operationId: GetTransfer
            parameters:
                - name: Authorization
                  in: header
                  description: HTTP Basic Auth with base64 encoded API_KEY:API_SECRET
                  required: true
                  schema:
                    type: string
                    example: Basic QVBJLUtFWTpBUEktU0VDUkVU
                - name: account_id
                  in: path
                  description: The account ID (bound from path variable).
                  required: true
                  schema:
                    type: string
                - name: transfer_id
                  in: path
                  description: The transfer ID (bound from path variable).
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Transfer'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
        delete:
            tags:
                - BrokerService
            summary: CancelTransfer
            description: |-
                CancelTransfer cancels a pending transfer.
                 DELETE /v1/accounts/{account_id}/transfers/{transfer_id}
            operationId: CancelTransfer
            parameters:
                - name: Authorization
                  in: header
                  description: HTTP Basic Auth with base64 encoded API_KEY:API_SECRET
                  required: true
                  schema:
                    type: string
                    example: Basic QVBJLUtFWTpBUEktU0VDUkVU
                - name: account_id
                  in: path
                  description: The account ID (bound from path variable).
                  required: true
                  schema:
                    type: string
                - name: transfer_id
                  in: path
                  description: The transfer ID (bound from path variable).
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CancelTransferResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /v1/trading/accounts/{account_id}/orders:
        get:
            tags:
                - BrokerService
            summary: ListTradingOrders
            description: |-
                ListTradingOrders retrieves orders for an account.
                 GET /v1/trading/accounts/{account_id}/orders
            operationId: ListTradingOrders
            parameters:
                - name: Authorization
                  in: header
                  description: HTTP Basic Auth with base64 encoded API_KEY:API_SECRET
                  required: true
                  schema:
                    type: string
                    example: Basic QVBJLUtFWTpBUEktU0VDUkVU
                - name: account_id
                  in: path
                  description: The account ID (bound from path variable).
                  required: true
                  schema:
                    type: string
                - name: status
                  in: query
                  description: Filter by status (open, closed, all).
                  required: false
                  schema:
                    type: string
                - name: limit
                  in: query
                  description: Maximum number of orders to return.
                  required: false
                  schema:
                    type: integer
                    format: int32
                - name: after
                  in: query
                  description: Cursor for pagination.
                  required: false
                  schema:
                    type: string
                - name: until
                  in: query
                  description: Filter by orders updated until this timestamp.
                  required: false
                  schema:
                    type: string
                - name: direction
                  in: query
                  description: Sort direction (asc, desc).
                  required: false
                  schema:
                    type: string
                - name: nested
                  in: query
                  description: Whether to include nested leg orders.
                  required: false
                  schema:
                    type: boolean
                - name: symbols
                  in: query
                  description: Filter by symbols (comma-separated).
                  required: false
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
