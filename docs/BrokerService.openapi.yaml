components:
    schemas:
        Error:
            type: object
            properties:
                message:
                    type: string
                    description: Error message (e.g., 'user not found', 'database connection failed')
            description: Error is returned when a handler encounters an error. It contains a simple error message that the developer can customize.
        FieldViolation:
            type: object
            properties:
                field:
                    type: string
                    description: The field path that failed validation (e.g., 'user.email' for nested fields). For header validation, this will be the header name (e.g., 'X-API-Key')
                description:
                    type: string
                    description: Human-readable description of the validation violation (e.g., 'must be a valid email address', 'required field missing')
            required:
                - field
                - description
            description: FieldViolation describes a single validation error for a specific field.
        ValidationError:
            type: object
            properties:
                violations:
                    type: array
                    items:
                        $ref: '#/components/schemas/FieldViolation'
                    description: List of validation violations
            required:
                - violations
            description: ValidationError is returned when request validation fails. It contains a list of field violations describing what went wrong.
        CreateAccountRequest:
            type: object
            properties:
                contact:
                    $ref: '#/components/schemas/Contact'
                identity:
                    $ref: '#/components/schemas/Identity'
                disclosures:
                    $ref: '#/components/schemas/Disclosures'
                agreements:
                    type: array
                    items:
                        $ref: '#/components/schemas/Agreement'
                    minItems: 1
                trustedContact:
                    $ref: '#/components/schemas/TrustedContact'
                accountType:
                    type: string
                    examples:
                        - trading
                    description: Account type (trading, custodial).
                    example: trading
                enabledAssetsMargin:
                    type: boolean
                    examples:
                        - true
                    description: Whether to enable margin for assets.
                    example: true
            required:
                - contact
                - identity
                - disclosures
            description: CreateAccountRequest is the request to create a new broker account.
        Contact:
            type: object
            properties:
                emailAddress:
                    type: string
                    examples:
                        - john.doe@example.com
                    description: Email address.
                    example: john.doe@example.com
                phoneNumber:
                    type: string
                    examples:
                        - +1-555-123-4567
                    description: Phone number.
                    example: +1-555-123-4567
                streetAddress:
                    type: array
                    items:
                        type: string
                        examples:
                            - 123 Main St
                            - Apt 4B
                        description: Street address lines.
                        example: 123 Main St
                unit:
                    type: string
                    examples:
                        - 4B
                    description: Unit number.
                    example: 4B
                city:
                    type: string
                    examples:
                        - New York
                    description: City.
                    example: New York
                state:
                    type: string
                    examples:
                        - NY
                    description: State/Province (2-letter code for US).
                    example: NY
                postalCode:
                    type: string
                    examples:
                        - 10001
                    description: Postal code.
                    example: 10001
                country:
                    type: string
                    examples:
                        - USA
                    description: Country (ISO 3166-1 alpha-3).
                    example: USA
                localStreetAddress:
                    type: array
                    items:
                        type: string
                        examples:
                            - 123 Local St
                        description: Local street address (for non-US addresses).
                        example: 123 Local St
            description: Contact represents contact information.
        Identity:
            type: object
            properties:
                givenName:
                    type: string
                    examples:
                        - John
                    description: Given/first name.
                    example: John
                middleName:
                    type: string
                    examples:
                        - William
                    description: Middle name.
                    example: William
                familyName:
                    type: string
                    examples:
                        - Doe
                    description: Family/last name.
                    example: Doe
                dateOfBirth:
                    type: string
                    examples:
                        - 1990-01-15
                    description: Date of birth (YYYY-MM-DD).
                    example: 1990-01-15
                taxId:
                    type: string
                    examples:
                        - 123-45-6789
                    description: Tax ID (SSN for US).
                    example: 123-45-6789
                taxIdType:
                    type: string
                    examples:
                        - USA_SSN
                    enum:
                        -
                        - USA_SSN
                        - ARG_AR_CUIT
                        - AUS_TFN
                        - DEU_TAX_ID
                        - NOT_SPECIFIED
                    description: Tax ID type.
                    example: USA_SSN
                countryOfCitizenship:
                    type: string
                    examples:
                        - USA
                    description: Country of citizenship (ISO 3166-1 alpha-3).
                    example: USA
                countryOfBirth:
                    type: string
                    examples:
                        - USA
                    description: Country of birth (ISO 3166-1 alpha-3).
                    example: USA
                countryOfTaxResidence:
                    type: string
                    examples:
                        - USA
                    description: Country of tax residence (ISO 3166-1 alpha-3).
                    example: USA
                visaType:
                    type: string
                    examples:
                        - H1B
                    description: Visa type (if applicable).
                    example: H1B
                visaExpirationDate:
                    type: string
                    examples:
                        - 2025-12-31
                    description: Visa expiration date (YYYY-MM-DD).
                    example: 2025-12-31
                dateOfDepartureFromUsa:
                    type: string
                    examples:
                        - 2020-01-01
                    description: Date of departure from USA (YYYY-MM-DD).
                    example: 2020-01-01
                permanentResident:
                    type: boolean
                    examples:
                        - false
                    description: Permanent resident.
                    example: false
                fundingSource:
                    type: array
                    items:
                        type: string
                        examples:
                            - employment_income
                        description: Funding source.
                        example: employment_income
                liquidNetWorthMin:
                    type: string
                    examples:
                        - 100000
                    description: Liquid net worth minimum.
                    example: 100000
                liquidNetWorthMax:
                    type: string
                    examples:
                        - 500000
                    description: Liquid net worth maximum.
                    example: 500000
                annualIncomeMin:
                    type: string
                    examples:
                        - 50000
                    description: Annual income minimum.
                    example: 50000
                annualIncomeMax:
                    type: string
                    examples:
                        - 100000
                    description: Annual income maximum.
                    example: 100000
                totalNetWorthMin:
                    type: string
                    examples:
                        - 200000
                    description: Total net worth minimum.
                    example: 200000
                totalNetWorthMax:
                    type: string
                    examples:
                        - 1000000
                    description: Total net worth maximum.
                    example: 1000000
                maritalStatus:
                    type: string
                    examples:
                        - SINGLE
                    description: Marital status.
                    example: SINGLE
                numberOfDependents:
                    type: integer
                    examples:
                        - 0
                    format: int32
                    description: Number of dependents.
                    example: 0
                investmentExperienceWithStocks:
                    type: string
                    examples:
                        - 1_to_5_years
                    description: Investment experience with stocks.
                    example: 1_to_5_years
                investmentExperienceWithOptions:
                    type: string
                    examples:
                        - none
                    description: Investment experience with options.
                    example: none
                liquidityNeeds:
                    type: string
                    description: Liquidity needs (deprecated, use account level).
                riskTolerance:
                    type: string
                    description: Risk tolerance (deprecated, use account level).
                investmentObjective:
                    type: string
                    description: Investment objective (deprecated, use account level).
                investmentTimeHorizon:
                    type: string
                    description: Investment time horizon (deprecated, use account level).
                partyType:
                    type: string
                    description: Party Type
            description: Identity represents identity information.
        Disclosures:
            type: object
            properties:
                isControlPerson:
                    type: boolean
                    examples:
                        - false
                    description: Whether the user is a control person.
                    example: false
                isAffiliatedExchangeOrFinra:
                    type: boolean
                    examples:
                        - false
                    description: Whether the user is affiliated with an exchange or FINRA.
                    example: false
                isPoliticallyExposed:
                    type: boolean
                    examples:
                        - false
                    description: Whether the user is a politically exposed person.
                    example: false
                immediateFamilyExposed:
                    type: boolean
                    examples:
                        - false
                    description: Whether the user has an immediate family member that is politically exposed.
                    example: false
                isDiscretionary:
                    type: boolean
                    examples:
                        - false
                    description: Whether the account is discretionary.
                    example: false
                employmentStatus:
                    type: string
                    examples:
                        - employed
                    description: Employment status (employed, unemployed, student, retired).
                    example: employed
                employerName:
                    type: string
                    examples:
                        - Acme Corp
                    description: Employer name.
                    example: Acme Corp
