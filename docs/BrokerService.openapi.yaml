                profit_loss:
                    type: array
                    items:
                        type: number
                        format: double
                        description: |-
                            Profit/loss values at each timestamp.
                             json_name pinned to snake_case to match the Alpaca API and the unwrap codegen's key lookup.
                profit_loss_pct:
                    type: array
                    items:
                        type: number
                        format: double
                        description: Profit/loss percentage at each timestamp.
                base_value:
                    type: number
                    examples:
                        - 50000.00
                    format: double
                    description: Base value (starting equity for P/L calculation).
                    example: 50000.00
                base_value_asof:
                    type: string
                    examples:
                        - 2024-01-14
                    description: Trading date of the base_value closing equity.
                    example: 2024-01-14
                timeframe:
                    type: string
                    examples:
                        - 1D
                    description: Time frame (1Min, 5Min, 15Min, 1H, 1D).
                    example: 1D
                cashflow:
                    type: object
                    additionalProperties:
                        type: array
                        items:
                            type: number
                            format: double
                    description: |-
                        Accumulated cashflow values by activity type (e.g. JNLC, DIV, CSD).
