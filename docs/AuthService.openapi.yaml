openapi: 3.1.0
info:
    title: AuthService API
    version: 1.0.0
paths:
    /v1/oauth2/token:
        post:
            tags:
                - AuthService
            summary: IssueToken
            description: |-
                IssueToken exchanges client credentials or an authorization code for token(s).
                 POST /v1/oauth2/token
            operationId: IssueToken
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/IssueTokenRequest'
                required: true
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/IssueTokenResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
components:
    schemas:
        Error:
            type: object
            properties:
                message:
                    type: string
                    description: Error message (e.g., 'user not found', 'database connection failed')
            description: Error is returned when a handler encounters an error. It contains a simple error message that the developer can customize.
        FieldViolation:
            type: object
            properties:
                field:
                    type: string
                    description: The field path that failed validation (e.g., 'user.email' for nested fields). For header validation, this will be the header name (e.g., 'X-API-Key')
                description:
                    type: string
                    description: Human-readable description of the validation violation (e.g., 'must be a valid email address', 'required field missing')
            required:
                - field
                - description
            description: FieldViolation describes a single validation error for a specific field.
        ValidationError:
            type: object
            properties:
                violations:
                    type: array
                    items:
                        $ref: '#/components/schemas/FieldViolation'
                    description: List of validation violations
            required:
                - violations
            description: ValidationError is returned when request validation fails. It contains a list of field violations describing what went wrong.
        IssueTokenRequest:
            type: object
            properties:
                grantType:
                    type: string
                    examples:
                        - client_credentials
                    enum:
                        - client_credentials
                    description: Grant type (required). Currently only "client_credentials" is supported.
                    example: client_credentials
                clientId:
                    type: string
                    examples:
                        - AKSF5FVOKXYKG4ATGCJQBA
                    description: Client ID (required).
                    example: AKSF5FVOKXYKG4ATGCJQBA
                clientSecret:
                    type: string
                    examples:
                        - MFRGGZDFMZTWQYLCMNSGKZTHNBQWEY3EMVTGO2DBMJRWIZLGM5UGCYTDMRSWMZ3I
                    description: Client secret (if using client_secret authentication).
                    example: MFRGGZDFMZTWQYLCMNSGKZTHNBQWEY3EMVTGO2DBMJRWIZLGM5UGCYTDMRSWMZ3I
                clientAssertionType:
                    type: string
                    examples:
                        - urn:ietf:params:oauth:client-assertion-type:jwt-bearer
                    description: Client assertion type (if using private_key_jwt authentication).
                    example: urn:ietf:params:oauth:client-assertion-type:jwt-bearer
                clientAssertion:
                    type: string
                    description: Client assertion JWT (if using private_key_jwt authentication).
            required:
                - grantType
                - clientId
            description: IssueTokenRequest is the request to issue OAuth2 tokens.
        IssueTokenResponse:
            type: object
            properties:
                accessToken:
                    type: string
                    examples:
                        - eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9...
                    description: The access token.
                    example: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9...
                expiresIn:
                    type: integer
                    examples:
                        - 900
                    format: int32
                    description: Time in seconds until the token expires.
                    example: 900
                tokenType:
                    type: string
                    examples:
                        - Bearer
                    description: Type of the token (e.g., Bearer).
                    example: Bearer
            description: IssueTokenResponse is the response containing the issued OAuth2 tokens.
