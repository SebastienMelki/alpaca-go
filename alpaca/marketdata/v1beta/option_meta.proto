syntax = "proto3";

package alpaca.marketdata.v1beta;

option go_package = "github.com/sebastienmelki/alpaca-go/internal/gen/alpaca/marketdata/v1beta;marketdatav1beta";

import "buf/validate/validate.proto";
import "sebuf/http/annotations.proto";

// GetOptionMetaConditionsRequest is the request to get option condition code mappings.
message GetOptionMetaConditionsRequest {
  // The type of ticks (required). Supported values: trade, quote.
  string ticktype = 1 [
    (buf.validate.field).required = true,
    (sebuf.http.field_examples) = { values: ["trade"] }
  ];
}

// GetOptionMetaConditionsResponse is the response containing option condition code mappings.
message GetOptionMetaConditionsResponse {
  // Map of condition code to human-readable description.
  map<string, string> conditions = 1 [(sebuf.http.unwrap) = true];
}

// GetOptionMetaExchangesRequest is the request to get option exchange code mappings.
message GetOptionMetaExchangesRequest {}

// GetOptionMetaExchangesResponse is the response containing option exchange code mappings.
message GetOptionMetaExchangesResponse {
  // Map of exchange code to exchange name.
  map<string, string> exchanges = 1 [(sebuf.http.unwrap) = true];
}
