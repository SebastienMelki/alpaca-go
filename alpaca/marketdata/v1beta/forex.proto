syntax = "proto3";

package alpaca.marketdata.v1beta;

option go_package = "github.com/sebastienmelki/alpaca-go/internal/gen/alpaca/marketdata/v1beta;marketdatav1beta";

import "buf/validate/validate.proto";
import "sebuf/http/annotations.proto";

// ForexRate represents a foreign exchange rate between two currencies at a given time.
message ForexRate {
  // The last bid price value of the currency at the end of the timeframe.
  double bp = 1 [(sebuf.http.field_examples) = { values: ["127.702"] }];

  // The last mid price value of the currency at the end of the timeframe.
  double mp = 2 [(sebuf.http.field_examples) = { values: ["127.757"] }];

  // The last ask price value of the currency at the end of the timeframe.
  double ap = 3 [(sebuf.http.field_examples) = { values: ["127.763"] }];

  // Timestamp of the rate in RFC-3339 format.
  string t = 4 [(sebuf.http.field_examples) = { values: ["2022-04-20T18:23:00Z"] }];
}

// ForexRateList is a list of forex rates for a single currency pair.
message ForexRateList {
  // List of forex rates.
  repeated ForexRate rates = 1 [(sebuf.http.unwrap) = true];
}

// GetForexRatesRequest is the request to get historical forex rates.
message GetForexRatesRequest {
  // A comma-separated string with currency pairs (required).
  string currency_pairs = 1 [
    (buf.validate.field).required = true,
    (sebuf.http.query) = { name: "currency_pairs" },
    (sebuf.http.field_examples) = { values: ["USDJPY,USDMXN"] }
  ];

  // The sampling interval of the currency rates.
  // Supported values: 5Sec, 5S, 1Min, 1T, 1Day, 1D.
  string timeframe = 2 [
    (sebuf.http.query) = { name: "timeframe" },
    (sebuf.http.field_examples) = { values: ["1Min"] }
  ];

  // The inclusive start of the interval. Format: RFC-3339 or YYYY-MM-DD.
  string start = 3 [
    (sebuf.http.query) = { name: "start" },
    (sebuf.http.field_examples) = { values: ["2024-01-03T00:00:00Z"] }
  ];

  // The inclusive end of the interval. Format: RFC-3339 or YYYY-MM-DD.
  string end = 4 [
    (sebuf.http.query) = { name: "end" },
    (sebuf.http.field_examples) = { values: ["2024-01-04T00:00:00Z"] }
  ];

  // Maximum number of data points to return (1-10000, default 1000).
  int32 limit = 5 [
    (sebuf.http.query) = { name: "limit" },
    (buf.validate.field).int32 = { gte: 1, lte: 10000 },
    (sebuf.http.field_examples) = { values: ["1000"] }
  ];

  // Sort data in ascending or descending order.
  string sort = 6 [
    (sebuf.http.query) = { name: "sort" },
    (sebuf.http.field_examples) = { values: ["asc"] }
  ];

  // Pagination token for the next page.
  string page_token = 7 [
    (sebuf.http.query) = { name: "page_token" },
    (sebuf.http.field_examples) = { values: ["token123"] }
  ];
}

// GetForexRatesResponse is the response containing historical forex rates.
message GetForexRatesResponse {
  // Map of currency pair to list of rates.
  map<string, ForexRateList> rates = 1;

  // Pagination token for the next page.
  string next_page_token = 2 [(sebuf.http.field_examples) = { values: ["VVNESlBZfDIwMjItMDEtMDNUMDA6MDM6MDBa"] }];
}

// GetLatestForexRatesRequest is the request to get the latest forex rates.
message GetLatestForexRatesRequest {
  // A comma-separated string with currency pairs (required).
  string currency_pairs = 1 [
    (buf.validate.field).required = true,
    (sebuf.http.query) = { name: "currency_pairs" },
    (sebuf.http.field_examples) = { values: ["USDJPY,USDMXN"] }
  ];
}

// GetLatestForexRatesResponse is the response containing the latest forex rates.
message GetLatestForexRatesResponse {
  // Map of currency pair to latest rate.
  map<string, ForexRate> rates = 1;
}
