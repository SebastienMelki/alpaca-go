syntax = "proto3";

package alpaca.marketdata.v1beta;

option go_package = "github.com/sebastienmelki/alpaca-go/internal/gen/alpaca/marketdata/v1beta;marketdatav1beta";

import "buf/validate/validate.proto";
import "sebuf/http/annotations.proto";

// FixedIncomePrice represents the price of a fixed income instrument as a percentage of its par value.
message FixedIncomePrice {
  // Timestamp in RFC-3339 format with nanosecond precision.
  string t = 1 [(sebuf.http.field_examples) = { values: ["2025-02-14T20:58:00.648Z"] }];

  // Price as a percentage of par value.
  double p = 2 [(sebuf.http.field_examples) = { values: ["99.6459"] }];

  // Yield to maturity.
  double ytm = 3 [(sebuf.http.field_examples) = { values: ["4.249"] }];

  // Yield to worst.
  double ytw = 4 [(sebuf.http.field_examples) = { values: ["4.249"] }];
}

// GetFixedIncomeLatestPricesRequest is the request to get latest fixed income prices.
message GetFixedIncomeLatestPricesRequest {
  // A comma-separated list of ISINs with a limit of 1000 (required).
  string isins = 1 [
    (buf.validate.field).required = true,
    (sebuf.http.query) = { name: "isins" },
    (sebuf.http.field_examples) = { values: ["US912797KJ59,US912797KS58,US912797LB15"] }
  ];
}

// GetFixedIncomeLatestPricesResponse is the response containing latest fixed income prices.
message GetFixedIncomeLatestPricesResponse {
  // Map of ISIN to latest price.
  map<string, FixedIncomePrice> prices = 1;
}
