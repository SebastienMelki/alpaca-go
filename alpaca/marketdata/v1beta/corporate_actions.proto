// CorporateActions contains all types of corporate actions grouped by type.
message CorporateActions {
  // Reverse stock splits.
  repeated ReverseSplit reverse_splits = 1;

  // Forward stock splits.
  repeated ForwardSplit forward_splits = 2;

  // Unit splits.
  repeated UnitSplit unit_splits = 3;

  // Stock dividends.
  repeated StockDividend stock_dividends = 4;

  // Cash dividends.
  repeated CashDividend cash_dividends = 5;

  // Spin-offs.
  repeated SpinOff spin_offs = 6;

  // Cash mergers.
  repeated CashMerger cash_mergers = 7;

  // Stock mergers.
  repeated StockMerger stock_mergers = 8;

  // Stock and cash mergers.
  repeated StockAndCashMerger stock_and_cash_mergers = 9;

  // Redemptions.
  repeated Redemption redemptions = 10;

  // Name/symbol changes.
  repeated NameChange name_changes = 11;

  // Worthless removals.
  repeated WorthlessRemoval worthless_removals = 12;

  // Rights distributions.
  repeated RightsDistribution rights_distributions = 13;
}

// GetCorporateActionsRequest is the request to get corporate actions data.
message GetCorporateActionsRequest {
  // A comma-separated list of symbols.
  string symbols = 1 [
    (sebuf.http.query) = { name: "symbols" },
    (sebuf.http.field_examples) = { values: ["AAPL,TSLA"] }
  ];

  // A comma-separated list of CUSIPs.
  string cusips = 2 [
    (sebuf.http.query) = { name: "cusips" },
    (sebuf.http.field_examples) = { values: ["037833100,88160R101"] }
  ];

  // A comma-separated list of corporate action types.
  // Supported types: reverse_split, forward_split, unit_split, cash_dividend,
  // stock_dividend, spin_off, cash_merger, stock_merger, stock_and_cash_merger,
  // redemption, name_change, worthless_removal, rights_distribution.
  string types = 3 [
    (sebuf.http.query) = { name: "types" },
    (sebuf.http.field_examples) = { values: ["forward_split,reverse_split"] }
  ];

  // The inclusive start of the interval. Format: YYYY-MM-DD. Default: current day.
  string start = 4 [
    (sebuf.http.query) = { name: "start" },
    (sebuf.http.field_examples) = { values: ["2024-08-14"] }
  ];

  // The inclusive end of the interval. Format: YYYY-MM-DD. Default: current day.
  string end = 5 [
    (sebuf.http.query) = { name: "end" },
    (sebuf.http.field_examples) = { values: ["2024-08-25"] }
  ];

  // A comma-separated list of corporate action IDs.
  // This parameter is mutually exclusive with all other filters.
  string ids = 6 [
    (sebuf.http.query) = { name: "ids" },
    (sebuf.http.field_examples) = { values: ["1dbc7685-9517-4a77-a236-8527d49cefdc,f8489167-4e4b-431d-a0be-6017ae1cf08a"] }
  ];

  // Maximum number of corporate actions to return (1-1000, default 100).
  int32 limit = 7 [
    (sebuf.http.query) = { name: "limit" },
    (buf.validate.field).int32 = { gte: 1, lte: 1000 },
    (sebuf.http.field_examples) = { values: ["100"] }
  ];

  // Pagination token for the next page.
  string page_token = 8 [
    (sebuf.http.query) = { name: "page_token" },
    (sebuf.http.field_examples) = { values: ["token123"] }
  ];

  // Sort data in ascending or descending order.
  string sort = 9 [
    (sebuf.http.query) = { name: "sort" },
    (sebuf.http.field_examples) = { values: ["asc"] }
  ];
}

// GetCorporateActionsResponse is the response containing corporate actions data.
message GetCorporateActionsResponse {
  // The corporate actions grouped by type.
  CorporateActions corporate_actions = 1;

  // Pagination token for the next page.
  string next_page_token = 2 [(sebuf.http.field_examples) = { values: ["YWJjZGVm"] }];
}
