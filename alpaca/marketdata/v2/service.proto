syntax = "proto3";

package alpaca.marketdata.v2;

import "sebuf/http/annotations.proto";
import "sebuf/http/headers.proto";
import "alpaca/marketdata/v2/common.proto";
import "alpaca/marketdata/v2/stock_bars.proto";
import "alpaca/marketdata/v2/stock_trades.proto";
import "alpaca/marketdata/v2/stock_quotes.proto";
import "alpaca/marketdata/v2/stock_snapshots.proto";
import "alpaca/marketdata/v2/stock_auctions.proto";
import "alpaca/marketdata/v2/stock_meta.proto";

// MarketDataService provides the Alpaca Market Data v2 API for stock data.
// Base URL: https://data.alpaca.markets
service MarketDataService {
  // Base path for all endpoints.
  option (sebuf.http.service_config) = {
    base_path: ""
  };

  // API key authentication required for all operations.
  option (sebuf.http.service_headers) = {
    required_headers: [
      {
        name: "APCA-API-KEY-ID"
        description: "Alpaca API key ID"
        type: "string"
        required: true
        example: "PKXXXXXXXXXXXXXXXXXX"
      },
      {
        name: "APCA-API-SECRET-KEY"
        description: "Alpaca API secret key"
        type: "string"
        required: true
        example: "XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX"
      }
    ]
  };

  // ============================================
  // Stock Data - Bars
  // ============================================

  // GetStockBars retrieves historical stock bars.
  // GET /v2/stocks/bars
  rpc GetStockBars(GetStockBarsRequest) returns (GetStockBarsResponse) {
    option (sebuf.http.config) = {
      path: "/v2/stocks/bars"
      method: HTTP_METHOD_GET
    };
  }

  // GetLatestStockBars retrieves the latest stock bars.
  // GET /v2/stocks/bars/latest
  rpc GetLatestStockBars(GetLatestStockBarsRequest) returns (GetLatestStockBarsResponse) {
    option (sebuf.http.config) = {
      path: "/v2/stocks/bars/latest"
      method: HTTP_METHOD_GET
    };
  }

  // GetStockBarsSingle retrieves historical bars for a single symbol.
  // GET /v2/stocks/{symbol}/bars
  rpc GetStockBarsSingle(GetStockBarsSingleRequest) returns (GetStockBarsSingleResponse) {
    option (sebuf.http.config) = {
      path: "/v2/stocks/{symbol}/bars"
      method: HTTP_METHOD_GET
    };
  }

  // GetLatestStockBarSingle retrieves the latest bar for a single symbol.
  // GET /v2/stocks/{symbol}/bars/latest
  rpc GetLatestStockBarSingle(GetLatestStockBarSingleRequest) returns (GetLatestStockBarSingleResponse) {
    option (sebuf.http.config) = {
      path: "/v2/stocks/{symbol}/bars/latest"
      method: HTTP_METHOD_GET
    };
  }

  // ============================================
  // Stock Data - Trades
  // ============================================

  // GetStockTrades retrieves historical stock trades.
  // GET /v2/stocks/trades
  rpc GetStockTrades(GetStockTradesRequest) returns (GetStockTradesResponse) {
    option (sebuf.http.config) = {
      path: "/v2/stocks/trades"
      method: HTTP_METHOD_GET
    };
  }

  // GetLatestStockTrades retrieves the latest stock trades.
  // GET /v2/stocks/trades/latest
  rpc GetLatestStockTrades(GetLatestStockTradesRequest) returns (GetLatestStockTradesResponse) {
    option (sebuf.http.config) = {
      path: "/v2/stocks/trades/latest"
      method: HTTP_METHOD_GET
    };
  }

  // GetStockTradesSingle retrieves historical trades for a single symbol.
  // GET /v2/stocks/{symbol}/trades
  rpc GetStockTradesSingle(GetStockTradesSingleRequest) returns (GetStockTradesSingleResponse) {
    option (sebuf.http.config) = {
      path: "/v2/stocks/{symbol}/trades"
      method: HTTP_METHOD_GET
    };
  }

  // GetLatestStockTradeSingle retrieves the latest trade for a single symbol.
  // GET /v2/stocks/{symbol}/trades/latest
  rpc GetLatestStockTradeSingle(GetLatestStockTradeSingleRequest) returns (GetLatestStockTradeSingleResponse) {
    option (sebuf.http.config) = {
      path: "/v2/stocks/{symbol}/trades/latest"
      method: HTTP_METHOD_GET
    };
  }

  // ============================================
  // Stock Data - Quotes
  // ============================================

  // GetStockQuotes retrieves historical stock quotes.
  // GET /v2/stocks/quotes
  rpc GetStockQuotes(GetStockQuotesRequest) returns (GetStockQuotesResponse) {
    option (sebuf.http.config) = {
      path: "/v2/stocks/quotes"
      method: HTTP_METHOD_GET
    };
  }

  // GetLatestStockQuotes retrieves the latest stock quotes.
  // GET /v2/stocks/quotes/latest
  rpc GetLatestStockQuotes(GetLatestStockQuotesRequest) returns (GetLatestStockQuotesResponse) {
    option (sebuf.http.config) = {
      path: "/v2/stocks/quotes/latest"
      method: HTTP_METHOD_GET
    };
  }

  // GetStockQuotesSingle retrieves historical quotes for a single symbol.
  // GET /v2/stocks/{symbol}/quotes
  rpc GetStockQuotesSingle(GetStockQuotesSingleRequest) returns (GetStockQuotesSingleResponse) {
    option (sebuf.http.config) = {
      path: "/v2/stocks/{symbol}/quotes"
      method: HTTP_METHOD_GET
    };
  }

  // GetLatestStockQuoteSingle retrieves the latest quote for a single symbol.
  // GET /v2/stocks/{symbol}/quotes/latest
  rpc GetLatestStockQuoteSingle(GetLatestStockQuoteSingleRequest) returns (GetLatestStockQuoteSingleResponse) {
    option (sebuf.http.config) = {
      path: "/v2/stocks/{symbol}/quotes/latest"
      method: HTTP_METHOD_GET
    };
  }

  // ============================================
  // Stock Data - Snapshots
  // ============================================

  // GetStockSnapshots retrieves stock snapshots for multiple symbols.
  // GET /v2/stocks/snapshots
  rpc GetStockSnapshots(GetStockSnapshotsRequest) returns (GetStockSnapshotsResponse) {
    option (sebuf.http.config) = {
      path: "/v2/stocks/snapshots"
      method: HTTP_METHOD_GET
    };
  }

  // GetStockSnapshot retrieves a single stock snapshot.
  // GET /v2/stocks/{symbol}/snapshot
  rpc GetStockSnapshot(GetStockSnapshotRequest) returns (Snapshot) {
    option (sebuf.http.config) = {
      path: "/v2/stocks/{symbol}/snapshot"
      method: HTTP_METHOD_GET
    };
  }

  // ============================================
  // Stock Data - Auctions
  // ============================================

  // GetStockAuctions retrieves stock auction data.
  // GET /v2/stocks/auctions
  rpc GetStockAuctions(GetStockAuctionsRequest) returns (GetStockAuctionsResponse) {
    option (sebuf.http.config) = {
      path: "/v2/stocks/auctions"
      method: HTTP_METHOD_GET
    };
  }

  // GetStockAuctionsSingle retrieves auction data for a single symbol.
  // GET /v2/stocks/{symbol}/auctions
  rpc GetStockAuctionsSingle(GetStockAuctionsSingleRequest) returns (GetStockAuctionsSingleResponse) {
    option (sebuf.http.config) = {
      path: "/v2/stocks/{symbol}/auctions"
      method: HTTP_METHOD_GET
    };
  }

  // ============================================
  // Stock Data - Metadata
  // ============================================

  // GetStockMetaConditions retrieves stock condition code mappings.
  // GET /v2/stocks/meta/conditions/{ticktype}
  rpc GetStockMetaConditions(GetStockMetaConditionsRequest) returns (GetStockMetaConditionsResponse) {
    option (sebuf.http.config) = {
      path: "/v2/stocks/meta/conditions/{ticktype}"
      method: HTTP_METHOD_GET
    };
  }

  // GetStockMetaExchanges retrieves stock exchange code mappings.
  // GET /v2/stocks/meta/exchanges
  rpc GetStockMetaExchanges(GetStockMetaExchangesRequest) returns (GetStockMetaExchangesResponse) {
    option (sebuf.http.config) = {
      path: "/v2/stocks/meta/exchanges"
      method: HTTP_METHOD_GET
    };
  }
}
