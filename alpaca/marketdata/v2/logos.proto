syntax = "proto3";

package alpaca.marketdata.v2;

import "buf/validate/validate.proto";
import "sebuf/http/annotations.proto";

// GetLogoRequest is the request to get a company logo image.
message GetLogoRequest {
  // A unique series of letters assigned to a security for trading purposes (required).
  string symbol = 1 [
    (buf.validate.field).required = true,
    (sebuf.http.field_examples) = { values: ["AAPL"] }
  ];

  // Whether to return a placeholder image if the logo is not found.
  bool placeholder = 2 [
    (sebuf.http.query) = { name: "placeholder" },
    (sebuf.http.field_examples) = { values: ["true"] }
  ];
}

// GetLogoResponse is the response containing the company logo image.
message GetLogoResponse {
  // The logo image data in PNG format.
  bytes image = 1;

  // The content type of the image (e.g., "image/png").
  string content_type = 2 [(sebuf.http.field_examples) = { values: ["image/png"] }];
}
