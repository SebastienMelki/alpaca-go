syntax = "proto3";

package alpaca.broker.v2;

import "sebuf/http/annotations.proto";
import "sebuf/http/headers.proto";
import "alpaca/broker/v2/sse.proto";

option go_package = "github.com/alpacahq/alpaca-go/alpaca/broker/v2;brokerv2";

// BrokerV2Service provides Broker API v2 endpoints.
// These are primarily the v2 event streaming endpoints that replace the deprecated v1 versions.
service BrokerV2Service {
  // Base path for all v2 endpoints.
  option (sebuf.http.service_config) = {
    base_path: "/v2"
  };

  // HTTP Basic authentication required for all operations.
  option (sebuf.http.service_headers) = {
    required_headers: [
      {
        name: "Authorization"
        description: "HTTP Basic Auth with base64 encoded API_KEY:API_SECRET"
        type: "string"
        required: true
        example: "Basic QVBJLUtFWTpBUEktU0VDUkVU"
      }
    ]
  };

  // SubscribeTradeEventsV2 subscribes to trade events via SSE (v2).
  // This endpoint replaces the deprecated /v1/events/trades endpoint.
  // Provides faster event delivery times and supports MLeg (multi-leg) order events.
  // GET /v2/events/trades
  rpc SubscribeTradeEventsV2(SubscribeTradeEventsV2Request) returns (SubscribeTradeEventsV2Response) {
    option (sebuf.http.config) = {
      path: "/events/trades"
      method: HTTP_METHOD_GET
    };
  }

  // SubscribeJournalEventsV2 subscribes to journal status events via SSE (v2).
  // This endpoint provides ULID-based event IDs instead of integer IDs.
  // Note: There is no compatibility between v1 and v2 event IDs.
  // GET /v2/events/journals/status
  rpc SubscribeJournalEventsV2(SubscribeJournalEventsV2Request) returns (SubscribeJournalEventsV2Response) {
    option (sebuf.http.config) = {
      path: "/events/journals/status"
      method: HTTP_METHOD_GET
    };
  }

  // SubscribeSystemEventsV2 subscribes to system events via SSE (v2).
  // System events notify when end-of-day balances or positions are ready.
  // GET /v2/events/system
  rpc SubscribeSystemEventsV2(SubscribeSystemEventsV2Request) returns (SubscribeSystemEventsV2Response) {
    option (sebuf.http.config) = {
      path: "/events/system"
      method: HTTP_METHOD_GET
    };
  }

  // SubscribeAdminActionsV2 subscribes to admin action events via SSE (v2).
  // Streams events related to administrative actions performed by Alpaca systems.
  // Event types: LegacyNote, Liquidation, TransactionCancel
  // GET /v2/events/admin-actions
  rpc SubscribeAdminActionsV2(SubscribeAdminActionsV2Request) returns (SubscribeAdminActionsV2Response) {
    option (sebuf.http.config) = {
      path: "/events/admin-actions"
      method: HTTP_METHOD_GET
    };
  }

  // SubscribeFundingStatusV2 subscribes to funding status events via SSE (v2).
  // Streams funding status updates for bank relationships, wire banks, and transfers.
  // GET /v2/events/funding/status
  rpc SubscribeFundingStatusV2(SubscribeFundingStatusV2Request) returns (SubscribeFundingStatusV2Response) {
    option (sebuf.http.config) = {
      path: "/events/funding/status"
      method: HTTP_METHOD_GET
    };
  }
}
