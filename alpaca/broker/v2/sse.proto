// AdminActionBelongsTo identifies what entity an admin action belongs to.
message AdminActionBelongsTo {
  // Kind of entity.
  string kind = 1 [(sebuf.http.field_examples) = { values: ["account"] }];
  // ID reference of the entity.
  string id_reference = 2 [(sebuf.http.field_examples) = { values: ["0bbf1dd7-4235-4eca-8b1a-0db63572c735"] }];
}

// AdminActionCreatedBy identifies who created an admin action.
message AdminActionCreatedBy {
  // Kind of creator.
  string kind = 1 [(sebuf.http.field_examples) = { values: ["admin"] }];
  // ID reference of the creator.
  string id_reference = 2 [(sebuf.http.field_examples) = { values: ["19455a3c-595f-457f-97b3-64a2b5aeae96"] }];
}

// LiquidationContext contains details for liquidation admin events.
message LiquidationContext {
  // Symbol that was liquidated.
  string symbol = 1 [(sebuf.http.field_examples) = { values: ["TSLA"] }];
  // Reason for liquidation.
  string reason = 2 [(sebuf.http.field_examples) = { values: ["Liquidation due to real time risk"] }];
  // Available quantity.
  string available_qty = 3 [(sebuf.http.field_examples) = { values: ["0.0001"] }];
  // Requested quantity.
  string requested_qty = 4 [(sebuf.http.field_examples) = { values: ["0.0001"] }];
  // Error message if any.
  string error = 5;
}

// TransactionCancelContext contains details for transaction cancel admin events.
message TransactionCancelContext {
  // Transaction ID that was cancelled.
  string transaction_id = 1 [
    (buf.validate.field).string.uuid = true,
    (sebuf.http.field_examples) = { values: ["fdf18af2-142b-409e-8aad-d1731e276af0"] }
  ];
  // Entry type (e.g., JNLC).
  string entry_type = 2 [(sebuf.http.field_examples) = { values: ["JNLC"] }];
  // External ID.
  string external_id = 3 [(sebuf.http.field_examples) = { values: ["d5eede2c-1c08-45df-9800-87ad5eefc11f"] }];
}

// AdminActionEventV2 represents an admin action event (v2).
message AdminActionEventV2 {
  // Event ID (ULID format).
  string event_id = 1 [(sebuf.http.field_examples) = { values: ["01GTVS4FVS2KJDTPYH2WM6NAXF"] }];
  // ID of the replaced event (optional).
  string replaces_event_id = 2 [(sebuf.http.field_examples) = { values: ["01GTVS4FVS2KJDTPYH2WM6NAXE"] }];
  // Timestamp of event.
  string at = 3 [(sebuf.http.field_examples) = { values: ["2023-03-06T16:38:01Z"] }];
  // Entity this action belongs to.
  AdminActionBelongsTo belongs_to = 4;
  // Who created this action.
  AdminActionCreatedBy created_by = 5;
  // Type of admin action.
  string type = 6 [(sebuf.http.field_examples) = { values: ["liquidation_admin_event"] }];
  // Category of admin action.
  string category = 7 [(sebuf.http.field_examples) = { values: ["order"] }];
  // Visibility of admin action.
  string visibility = 8 [(sebuf.http.field_examples) = { values: ["external"] }];
  // Free text description of the admin action.
  string note = 9 [(sebuf.http.field_examples) = { values: ["Position liquidated: Asset: TSLA"] }];
  // Related correspondent.
  string correspondent = 10 [(sebuf.http.field_examples) = { values: ["LPCA"] }];
  // Context depends on the type - can be liquidation or transaction cancel context.
  oneof context {
    LiquidationContext liquidation_context = 11;
    TransactionCancelContext transaction_cancel_context = 12;
  }
}


// FundingStatusEventV2 represents a funding status change event (v2).
message FundingStatusEventV2 {
  // Event ID (ULID format).
  string event_id = 1 [(sebuf.http.field_examples) = { values: ["01F7VQQ782DM57SJNWAYMD14J9"] }];
  // Timestamp of the status change.
  string at = 2 [(sebuf.http.field_examples) = { values: ["2025-04-11T19:52:24.066998Z"] }];
  // Account UUID.
  string account_id = 3 [
    (buf.validate.field).string.uuid = true,
    (sebuf.http.field_examples) = { values: ["8e00606a-c9ac-409a-ba45-f55e8f77984a"] }
  ];
  // Correspondent code.
  string correspondent = 4 [(sebuf.http.field_examples) = { values: ["LPCA"] }];
  // Entity UUID.
  string entity_id = 5 [
    (buf.validate.field).string.uuid = true,
    (sebuf.http.field_examples) = { values: ["c4ed4206-697b-4859-ab71-b9de6649859d"] }
  ];
  // Entity type (BankRelationship, WireBank, Transfer).
  string entity_type = 6 [(sebuf.http.field_examples) = { values: ["BankRelationship"] }];
  // Previous status (null if first status).
  string status_from = 7 [(sebuf.http.field_examples) = { values: ["QUEUED"] }];
  // New status.
  string status_to = 8 [(sebuf.http.field_examples) = { values: ["REJECTED"] }];
  // Reason for status change (used when rejected/canceled).
  string reason = 9 [(sebuf.http.field_examples) = { values: ["bank account owner name does not match brokerage account name"] }];
}

