syntax = "proto3";

package alpaca.broker.v2;

import "buf/validate/validate.proto";
import "sebuf/http/annotations.proto";

option go_package = "github.com/alpacahq/alpaca-go/alpaca/broker/v2;brokerv2";


// TradeUpdateEventV2Leg represents a leg of a multi-leg order fill event.
message TradeUpdateEventV2Leg {
  // The amount of shares filled for this event.
  string qty = 1 [(sebuf.http.field_examples) = { values: ["1"] }];

  // The average price per share for this event.
  string price = 2 [(sebuf.http.field_examples) = { values: ["0.04"] }];

  // Symbol of the asset.
  string symbol = 3 [(sebuf.http.field_examples) = { values: ["AAPL250117P00200000"] }];

  // Order ID for this leg.
  string order_id = 4 [
    (buf.validate.field).string.uuid = true,
    (sebuf.http.field_examples) = { values: ["8d58279f-7dc8-415f-8495-32f394935509"] }
  ];

  // Timestamp of this event leg.
  string timestamp = 5 [(sebuf.http.field_examples) = { values: ["2025-01-14T16:05:51.867802561Z"] }];

  // Execution ID for this leg.
  string execution_id = 6 [
    (buf.validate.field).string.uuid = true,
    (sebuf.http.field_examples) = { values: ["ccf7d1dc-78e1-4eb5-92c6-5c86b2bcca8f"] }
  ];
}

// TradeUpdateEventV2 represents a trade update event (v2).
message TradeUpdateEventV2 {
  // Account UUID.
  string account_id = 1 [
    (buf.validate.field).string.uuid = true,
    (sebuf.http.field_examples) = { values: ["529248ad-c4cc-4a50-bea4-6bfd2953f83a"] }
  ];

  // Timestamp of event.
  string at = 2 [(sebuf.http.field_examples) = { values: ["2022-04-19T14:12:30.656741Z"] }];

  // Event type.
  string event = 3 [(sebuf.http.field_examples) = { values: ["fill"] }];

  // Event ID (ULID format - lexically sortable, monotonically increasing).
  string event_id = 4 [(sebuf.http.field_examples) = { values: ["01G112NTT0XAXKDZK3AABK68TH"] }];

  // Execution ID (not present for MultilegOptions).
  string execution_id = 5 [(sebuf.http.field_examples) = { values: ["7e544af3-3104-4e1a-8cbc-dab2624949ff"] }];

  // Previous execution ID (present only in trade_bust and trade_correct events).
  string previous_execution_id = 6 [(sebuf.http.field_examples) = { values: ["aeb60660-412f-4537-8d1f-1101b3fc8f64"] }];

  // Order details (JSON object).
  string order = 7 [(sebuf.http.field_examples) = { values: ["{\"id\": \"...\", \"symbol\": \"AAPL\"}"] }];

  // Timestamp of the event.
  string timestamp = 8 [(sebuf.http.field_examples) = { values: ["2022-04-19T14:12:30.602193534Z"] }];

  // Price at execution (for fills).
  string price = 9 [(sebuf.http.field_examples) = { values: ["150.25"] }];

  // Swap rate for local currency/crypto trades.
  string swap_rate = 10 [(sebuf.http.field_examples) = { values: ["1.0"] }];

  // Position quantity after fill (not for MultilegOptions).
  string position_qty = 11 [(sebuf.http.field_examples) = { values: ["200"] }];

  // Position quantities for MultilegOptions (map of symbol to quantity).
  map<string, string> position_qtys = 12;

  // Quantity filled for this event.
  string qty = 13 [(sebuf.http.field_examples) = { values: ["100"] }];

  // Legs for MultilegOptions fill events.
  repeated TradeUpdateEventV2Leg legs = 14;
}

// JournalStatusEventV2 represents a journal status change event (v2).
message JournalStatusEventV2 {
  // Timestamp of event.
  string at = 1 [(sebuf.http.field_examples) = { values: ["2021-05-07T10:28:23.163857Z"] }];

  // Journal entry type (JNLC or JNLS).
  string entry_type = 2 [(sebuf.http.field_examples) = { values: ["JNLC"] }];

  // Event ID (ULID format).
  string event_id = 3 [(sebuf.http.field_examples) = { values: ["01F535Y1FVY8WZHE763HCNS8SZ"] }];

  // Journal UUID.
  string journal_id = 4 [
    (buf.validate.field).string.uuid = true,
    (sebuf.http.field_examples) = { values: ["2f144d2a-91e6-46ff-8e37-959a701cc58d"] }
  ];

  // Previous status.
  string status_from = 5 [(sebuf.http.field_examples) = { values: ["queued"] }];

  // New status.
  string status_to = 6 [(sebuf.http.field_examples) = { values: ["executed"] }];

  // Description of the journal event.
  string description = 7 [(sebuf.http.field_examples) = { values: ["Journal of cash between accounts"] }];

  // Idempotency key (if provided).
  string idempotency_key = 8 [(sebuf.http.field_examples) = { values: ["72bdf18f-7410-43ec-b4e8-b6e41c5c0160"] }];

  // Type of idempotency key (single or batch).
  string idempotency_key_type = 9 [(sebuf.http.field_examples) = { values: ["single"] }];

  // Batch error message (if idempotency_key_type is batch).
  string batch_error_message = 10;
}

// SystemEventV2 represents a system event (v2).
message SystemEventV2 {
  // Timestamp of the event.
  string at = 1 [(sebuf.http.field_examples) = { values: ["2026-01-05T10:28:23.163857Z"] }];

  // Event ID (ULID format).
  string event_id = 2 [(sebuf.http.field_examples) = { values: ["01F535Y1FVY8WZHE763HCNS8SZ"] }];

  // System event type.
  string type = 3 [(sebuf.http.field_examples) = { values: ["eod_balances_ready"] }];

  // System date to which this event belongs.
  string system_date = 4 [(sebuf.http.field_examples) = { values: ["2026-01-05"] }];

  // Human readable description of the system event.
  string description = 5 [(sebuf.http.field_examples) = { values: ["End-of-day balances are now available."] }];
}

// SubscribeTradeEventsV2Request is the request to subscribe to trade events (v2).
message SubscribeTradeEventsV2Request {
  // Starting date filter (YYYY-MM-DD).
  string since = 1 [
    (sebuf.http.query) = { name: "since" },
    (sebuf.http.field_examples) = { values: ["2024-01-15"] }
  ];

  // Ending date filter (YYYY-MM-DD).
  string until = 2 [
    (sebuf.http.query) = { name: "until" },
    (sebuf.http.field_examples) = { values: ["2024-01-31"] }
  ];

  // Starting event ID (ULID).
  string since_id = 3 [
    (sebuf.http.query) = { name: "since_id" },
    (sebuf.http.field_examples) = { values: ["01G112NTT0XAXKDZK3AABK68TH"] }
  ];

  // Ending event ID (ULID).
  string until_id = 4 [
    (sebuf.http.query) = { name: "until_id" },
    (sebuf.http.field_examples) = { values: ["01G112NTT0XAXKDZK3AABK68TI"] }
  ];
}

