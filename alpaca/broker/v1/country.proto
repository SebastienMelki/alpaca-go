syntax = "proto3";

package alpaca.broker.v1;

import "sebuf/http/annotations.proto";


// CountryStatus represents whether a country is supported.
enum CountryStatus {
  // option (sebuf.http.enum_encoding) = ENUM_ENCODING_STRING;
  COUNTRY_STATUS_UNSPECIFIED = 0;
  COUNTRY_STATUS_SUPPORTED = 1; // [(sebuf.http.enum_value) = "supported"];
  COUNTRY_STATUS_NOT_SUPPORTED = 2; // [(sebuf.http.enum_value) = "not_supported"];
  COUNTRY_STATUS_RESTRICTED = 3; // [(sebuf.http.enum_value) = "restricted"];
}

// Country represents country information.
message Country {
  // ISO 3166-1 alpha-2 country code.
  string code = 1 [(sebuf.http.field_examples) = { values: ["US"] }];

  // ISO 3166-1 alpha-3 country code.
  string code3 = 2 [(sebuf.http.field_examples) = { values: ["USA"] }];

  // Country name.
  string name = 3 [(sebuf.http.field_examples) = { values: ["United States"] }];

  // Whether the country is supported for account opening.
  bool supported = 4 [(sebuf.http.field_examples) = { values: ["true"] }];

  // Status of the country.
  string status = 5 [(sebuf.http.field_examples) = { values: ["supported"] }];

  // Required documents for this country.
  repeated string required_documents = 6;

  // Supported account types for this country.
  repeated string account_types = 7;

  // Notes or restrictions for this country.
  string notes = 8 [(sebuf.http.field_examples) = { values: ["Full support for all account types"] }];
}

// State represents a state/province/region within a country.
message State {
  // State code (e.g., CA, NY).
  string code = 1 [(sebuf.http.field_examples) = { values: ["CA"] }];

  // State name.
  string name = 2 [(sebuf.http.field_examples) = { values: ["California"] }];

  // Country code.
  string country_code = 3 [(sebuf.http.field_examples) = { values: ["US"] }];
}

// ListCountriesRequest is the request to list countries.
message ListCountriesRequest {
  // Filter by supported status only.
  bool supported_only = 1 [
    (sebuf.http.query) = { name: "supported_only" },
    (sebuf.http.field_examples) = { values: ["true"] }
  ];
}

// ListCountriesResponse is the response containing countries.
message ListCountriesResponse {
  // List of countries.
  repeated Country countries = 1; // [(sebuf.http.unwrap_root) = true];
}

// GetCountryRequest is the request to get a specific country.
message GetCountryRequest {
  // The country code (ISO 3166-1 alpha-2).
  string country_code = 1 [
    (sebuf.http.field_examples) = { values: ["US"] }
  ];
}

// ListStatesRequest is the request to list states for a country.
message ListStatesRequest {
  // The country code (ISO 3166-1 alpha-2).
  string country_code = 1 [
    (sebuf.http.field_examples) = { values: ["US"] }
  ];
}

// ListStatesResponse is the response containing states.
message ListStatesResponse {
  // List of states.
  repeated State states = 1; // [(sebuf.http.unwrap_root) = true];
}
