syntax = "proto3";

package alpaca.broker.v1;

import "buf/validate/validate.proto";
import "sebuf/http/annotations.proto";

// TransferIRA represents IRA-specific transfer details.
message TransferIRA {
  // Tax year for the contribution.
  int32 tax_year = 1;
  // Federal tax withholding amount.
  string federal_tax_withholding = 2;
  // State tax withholding amount.
  string state_tax_withholding = 3;
  // Withholding state.
  string withholding_state = 4;
}

// Transfer represents a fund transfer.
message Transfer {
  // Transfer ID (UUID).
  string id = 1 [
    (buf.validate.field).string.uuid = true,
    (sebuf.http.field_examples) = { values: ["a1b2c3d4-e5f6-7890-abcd-ef1234567890"] }
  ];

  // Account ID (UUID).
  string account_id = 2 [
    (buf.validate.field).string.uuid = true,
    (sebuf.http.field_examples) = { values: ["904837e3-3b76-47ec-b432-046db621571b"] }
  ];

  // ACH relationship ID (if ACH transfer, optional, UUID format when present).
  string relationship_id = 3 [(sebuf.http.field_examples) = { values: ["f5fbd77f-7b7e-4b91-8e8a-aaaa00000001"] }];

  // Bank ID (if wire transfer).
  string bank_id = 4;

  // Transfer type.
  string type = 5 [(sebuf.http.field_examples) = { values: ["ach"] }];

  // Transfer status.
  string status = 6 [(sebuf.http.field_examples) = { values: ["COMPLETE"] }];

  // Transfer direction.
  string direction = 7 [(sebuf.http.field_examples) = { values: ["INCOMING"] }];

  // Transfer amount.
  string amount = 8 [(sebuf.http.field_examples) = { values: ["1000.00"] }];

  // Creation timestamp (RFC 3339).
  string created_at = 9 [(sebuf.http.field_examples) = { values: ["2024-01-15T10:30:00Z"] }];

  // Last update timestamp (RFC 3339).
  string updated_at = 10 [(sebuf.http.field_examples) = { values: ["2024-01-15T10:30:00Z"] }];

  // Expiration date (RFC 3339).
  string expires_at = 11 [(sebuf.http.field_examples) = { values: ["2024-01-22T10:30:00Z"] }];

  // Reason for cancellation/rejection.
  string reason = 12;

  // Additional data.
  string additional_information = 13;

  // Fee associated with the transfer.
  string fee = 14 [(sebuf.http.field_examples) = { values: ["0.00"] }];

  // Requested amount (before fees).
  string requested_amount = 15 [(sebuf.http.field_examples) = { values: ["1000.00"] }];

  // Hold until date.
  string hold_until = 16;

  // Instant funding amount.
  string instant_amount = 17;

  // Fee payment method.
  string fee_payment_method = 18;

  // IRA-specific details.
  TransferIRA ira = 19;

  // Currency code.
  string currency = 20 [(sebuf.http.field_examples) = { values: ["USD"] }];
}
