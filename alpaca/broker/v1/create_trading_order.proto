syntax = "proto3";

package alpaca.broker.v1;

import "buf/validate/validate.proto";
import "sebuf/http/annotations.proto";

// BrokerTakeProfitSpec specifies take profit parameters for bracket orders.
message BrokerTakeProfitSpec {
  // Limit price for take profit.
  string limit_price = 1 [
    (buf.validate.field).required = true,
    (sebuf.http.field_examples) = { values: ["160.00"] },
    json_name = "limit_price"
  ];
}

// BrokerStopLossSpec specifies stop loss parameters for bracket orders.
message BrokerStopLossSpec {
  // Stop price for stop loss.
  string stop_price = 1 [
    (buf.validate.field).required = true,
    (sebuf.http.field_examples) = { values: ["140.00"] },
    json_name = "stop_price"
  ];

  // Limit price for stop loss.
  string limit_price = 2 [
    (sebuf.http.field_examples) = { values: ["139.00"] },
    json_name = "limit_price"
  ];
}

// CreateTradingOrderRequest is the request to create a trading order for a broker account.
message CreateTradingOrderRequest {
  // The account ID (bound from path variable).
  string account_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true,
    (sebuf.http.field_examples) = { values: ["904837e3-3b76-47ec-b432-046db621571b"] },
    json_name = "account_id"
  ];

  // Symbol or asset ID to trade.
  string symbol = 2 [
    (buf.validate.field).required = true,
    (sebuf.http.field_examples) = { values: ["AAPL"] },
    json_name = "symbol"
  ];

  // Quantity to trade (required if notional not specified).
  string qty = 3 [
    (sebuf.http.field_examples) = { values: ["10"] },
    json_name = "qty"
  ];

  // Notional value to trade (required if qty not specified).
  string notional = 4 [
    (sebuf.http.field_examples) = { values: ["1000.00"] },
    json_name = "notional"
  ];

  // Order side.
  string side = 5 [
    (buf.validate.field) = {
      required: true,
      string: {
        in: ["buy", "sell"]
      }
    },
    (sebuf.http.field_examples) = { values: ["buy"] },
    json_name = "side"
  ];

  // Order type.
  string type = 6 [
    (buf.validate.field) = {
      required: true,
      string: {
        in: ["market", "limit", "stop", "stop_limit", "trailing_stop"]
      }
    },
    (sebuf.http.field_examples) = { values: ["limit"] },
    json_name = "type"
  ];

  // Time in force.
  string time_in_force = 7 [
    (buf.validate.field) = {
      required: true,
      string: {
        in: ["day", "gtc", "opg", "cls", "ioc", "fok"]
      }
    },
    (sebuf.http.field_examples) = { values: ["day"] },
    json_name = "time_in_force"
  ];

  // Limit price (for limit orders).
  string limit_price = 8 [
    (sebuf.http.field_examples) = { values: ["150.00"] },
    json_name = "limit_price"
  ];

  // Stop price (for stop orders).
  string stop_price = 9 [
    (sebuf.http.field_examples) = { values: ["145.00"] },
    json_name = "stop_price"
  ];

  // Trail price (for trailing stop orders).
  string trail_price = 10 [
    (sebuf.http.field_examples) = { values: ["5.00"] },
    json_name = "trail_price"
  ];

  // Trail percent (for trailing stop orders).
  string trail_percent = 11 [
    (sebuf.http.field_examples) = { values: ["5.0"] },
    json_name = "trail_percent"
  ];

  // Extended hours trading.
  bool extended_hours = 12 [
    (sebuf.http.field_examples) = { values: ["false"] },
    json_name = "extended_hours"
  ];

  // Client order ID.
  string client_order_id = 13 [
    (buf.validate.field).string = { max_len: 48 },
    (sebuf.http.field_examples) = { values: ["my_order_123"] },
    json_name = "client_order_id"
  ];

  // Order class.
  string order_class = 14 [
    (buf.validate.field) = {
      string: {
        in: ["", "simple", "bracket", "oco", "oto"]
      }
    },
    (sebuf.http.field_examples) = { values: ["simple"] },
    json_name = "order_class"
  ];

  // Take profit spec (for bracket orders).
  BrokerTakeProfitSpec take_profit = 15 [json_name = "take_profit"];

  // Stop loss spec (for bracket orders).
  BrokerStopLossSpec stop_loss = 16 [json_name = "stop_loss"];

  // Commission to charge.
  string commission = 17 [
    (sebuf.http.field_examples) = { values: ["0.00"] },
    json_name = "commission"
  ];
}
