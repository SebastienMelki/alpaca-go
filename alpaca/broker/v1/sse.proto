// SubscribeNTAEventsRequest is the request to subscribe to non-trading activity events.
message SubscribeNTAEventsRequest {
  // Filter by specific event ID.
  string id = 1 [
    (sebuf.http.query) = { name: "id" }
  ];

  // Starting timestamp (format: YYYY-MM-DD).
  string since = 2 [
    (sebuf.http.query) = { name: "since" },
    (sebuf.http.field_examples) = { values: ["2024-01-15"] }
  ];

  // Ending timestamp (format: YYYY-MM-DD).
  string until = 3 [
    (sebuf.http.query) = { name: "until" },
    (sebuf.http.field_examples) = { values: ["2024-01-15"] }
  ];

  // Starting event ID (integer-based pagination).
  int64 since_id = 4 [
    (sebuf.http.query) = { name: "since_id" }
  ];

  // Ending event ID (integer-based pagination).
