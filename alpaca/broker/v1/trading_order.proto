syntax = "proto3";

package alpaca.broker.v1;

import "buf/validate/validate.proto";
import "sebuf/http/annotations.proto";

// BrokerOrder represents a trading order for a broker account.
message BrokerOrder {
  // Order ID (UUID).
  string id = 1 [
    (buf.validate.field).string.uuid = true,
    (sebuf.http.field_examples) = { values: ["61e69015-8549-4bfd-b9c3-01e75843f47d"] }
  ];

  // Client order ID.
  string client_order_id = 2 [(sebuf.http.field_examples) = { values: ["my_order_123"] }];

  // Creation timestamp (RFC 3339).
  string created_at = 3 [(sebuf.http.field_examples) = { values: ["2024-01-15T10:30:00Z"] }];

  // Last update timestamp.
  string updated_at = 4 [(sebuf.http.field_examples) = { values: ["2024-01-15T10:30:05Z"] }];

  // Submission timestamp.
  string submitted_at = 5 [(sebuf.http.field_examples) = { values: ["2024-01-15T10:30:00Z"] }];

  // Fill timestamp.
  string filled_at = 6 [(sebuf.http.field_examples) = { values: ["2024-01-15T10:30:05Z"] }];

  // Expiration timestamp.
  string expired_at = 7;

  // Cancellation timestamp.
  string canceled_at = 8;

  // Failure timestamp.
  string failed_at = 9;

  // Replacement timestamp.
  string replaced_at = 10;

  // Cancel requested timestamp.
  string cancel_requested_at = 11;

  // Order ID that replaced this order (optional, UUID format when present).
  string replaced_by = 12 [(sebuf.http.field_examples) = { values: ["71e69015-8549-4bfd-b9c3-01e75843f47d"] }];

  // Order ID that this order replaces (optional, UUID format when present).
  string replaces = 13 [(sebuf.http.field_examples) = { values: ["81e69015-8549-4bfd-b9c3-01e75843f47d"] }];

  // Asset ID.
  string asset_id = 14 [
    (buf.validate.field).string.uuid = true,
    (sebuf.http.field_examples) = { values: ["b0b6dd9d-8b9b-48a9-ba46-b9d54906e415"] }
  ];

  // Symbol.
  string symbol = 15 [(sebuf.http.field_examples) = { values: ["AAPL"] }];

  // Asset class.
  string asset_class = 16 [(sebuf.http.field_examples) = { values: ["us_equity"] }];

  // Notional value (for fractional orders).
  string notional = 17 [(sebuf.http.field_examples) = { values: ["1000.00"] }];

  // Quantity ordered.
  string qty = 18 [(sebuf.http.field_examples) = { values: ["10"] }];

  // Quantity filled.
  string filled_qty = 19 [(sebuf.http.field_examples) = { values: ["10"] }];

  // Average fill price.
  string filled_avg_price = 20 [(sebuf.http.field_examples) = { values: ["150.25"] }];

  // Order class.
  string order_class = 21 [(sebuf.http.field_examples) = { values: ["simple"] }];

  // Order type (alias for type).
  string order_type = 22 [(sebuf.http.field_examples) = { values: ["limit"] }];

  // Order type.
  string type = 23 [(sebuf.http.field_examples) = { values: ["limit"] }];

  // Order side.
  string side = 24 [(sebuf.http.field_examples) = { values: ["buy"] }];

  // Time in force.
  string time_in_force = 25 [(sebuf.http.field_examples) = { values: ["day"] }];

  // Limit price.
  string limit_price = 26 [(sebuf.http.field_examples) = { values: ["150.00"] }];

  // Stop price.
  string stop_price = 27 [(sebuf.http.field_examples) = { values: ["145.00"] }];

  // Order status.
  string status = 28 [(sebuf.http.field_examples) = { values: ["filled"] }];

  // Extended hours trading.
  bool extended_hours = 29 [(sebuf.http.field_examples) = { values: ["false"] }];

  // Leg orders.
  repeated BrokerOrder legs = 30;

  // Trail percent.
  string trail_percent = 31 [(sebuf.http.field_examples) = { values: ["5.0"] }];

  // Trail price.
  string trail_price = 32 [(sebuf.http.field_examples) = { values: ["5.00"] }];

  // High water mark.
  string hwm = 33 [(sebuf.http.field_examples) = { values: ["155.00"] }];

  // Commission charged.
  string commission = 34 [(sebuf.http.field_examples) = { values: ["0.00"] }];

  // Commission in basis points.
  string commission_bps = 35;

  // Commission type.
  string commission_type = 36;

  // Position intent for options.
  string position_intent = 37 [(sebuf.http.field_examples) = { values: ["buy_to_open"] }];

  // Order subtag.
  string subtag = 38;

  // Order source.
  string source = 39;

  // Swap fee in basis points.
  string swap_fee_bps = 40;

  // Swap rate.
  string swap_rate = 41;

  string expires_at = 42 [(sebuf.http.field_examples) = { values: ["2024-01-15T10:30:05Z"] }];
}
