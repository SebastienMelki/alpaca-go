  // ============================================
  // JIT Settlement Operations
  // ============================================

  // ListJITSettlements retrieves JIT settlements.
  // GET /v1/jit/settlements
  rpc ListJITSettlements(ListJITSettlementsRequest) returns (ListJITSettlementsResponse) {
    option (sebuf.http.config) = {
      path: "/jit/settlements"
      method: HTTP_METHOD_GET
    };
  }

  // GetJITSettlement retrieves a specific JIT settlement.
  // GET /v1/jit/settlements/{settlement_id}
  rpc GetJITSettlement(GetJITSettlementRequest) returns (JITSettlement) {
    option (sebuf.http.config) = {
      path: "/jit/settlements/{settlement_id}"
