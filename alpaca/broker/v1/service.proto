syntax = "proto3";

package alpaca.broker.v1;

import "sebuf/http/annotations.proto";
import "sebuf/http/headers.proto";
import "alpaca/broker/v1/broker_account.proto";
import "alpaca/broker/v1/create_account.proto";
import "alpaca/broker/v1/list_accounts.proto";
import "alpaca/broker/v1/get_account.proto";
import "alpaca/broker/v1/update_account.proto";
import "alpaca/broker/v1/close_account.proto";
import "alpaca/broker/v1/ach_relationship.proto";
import "alpaca/broker/v1/create_ach_relationship.proto";
import "alpaca/broker/v1/list_ach_relationships.proto";
import "alpaca/broker/v1/delete_ach_relationship.proto";
import "alpaca/broker/v1/transfer.proto";
import "alpaca/broker/v1/create_transfer.proto";
import "alpaca/broker/v1/list_transfers.proto";
import "alpaca/broker/v1/get_transfer.proto";
import "alpaca/broker/v1/cancel_transfer.proto";
import "alpaca/broker/v1/trading_order.proto";
import "alpaca/broker/v1/create_trading_order.proto";
import "alpaca/broker/v1/list_trading_orders.proto";
import "alpaca/broker/v1/get_trading_order.proto";
import "alpaca/broker/v1/cancel_trading_order.proto";
import "alpaca/broker/v1/trading_position.proto";
import "alpaca/broker/v1/document.proto";
import "alpaca/broker/v1/watchlist.proto";
import "alpaca/broker/v1/broker_crypto_funding.proto";
import "alpaca/broker/v1/journal.proto";
import "alpaca/broker/v1/rebalancing.proto";
import "alpaca/broker/v1/jit.proto";
import "alpaca/broker/v1/instant_funding.proto";
import "alpaca/broker/v1/fpsl.proto";
import "alpaca/broker/v1/oauth.proto";
import "alpaca/broker/v1/sse.proto";
import "alpaca/broker/v1/cip.proto";
import "alpaca/broker/v1/onfido.proto";
import "alpaca/broker/v1/calendar.proto";
import "alpaca/broker/v1/options.proto";
import "alpaca/broker/v1/ira.proto";
import "alpaca/broker/v1/country.proto";
import "alpaca/broker/v1/ipo.proto";
import "alpaca/broker/v1/trading_account.proto";
import "alpaca/broker/v1/account_activity.proto";
import "alpaca/broker/v1/broker_portfolio_history.proto";

// BrokerService provides the Alpaca Broker API for B2B operations.
// Base URL: https://broker-api.alpaca.markets
// Authentication: HTTP Basic Auth with base64 encoded API_KEY:API_SECRET
service BrokerService {
  // Base path for all endpoints.
  option (sebuf.http.service_config) = {
    base_path: "/v1"
  };

  // HTTP Basic authentication required for all operations.
  option (sebuf.http.service_headers) = {
    required_headers: [
      {
        name: "Authorization"
        description: "HTTP Basic Auth with base64 encoded API_KEY:API_SECRET"
        type: "string"
        required: true
        example: "Basic QVBJLUtFWTpBUEktU0VDUkVU"
      }
    ]
  };

  // ============================================
  // Account Operations
  // ============================================

  // CreateAccount creates a new broker-managed account.
  // POST /v1/accounts
  rpc CreateAccount(CreateAccountRequest) returns (BrokerAccount) {
    option (sebuf.http.config) = {
      path: "/accounts"
      method: HTTP_METHOD_POST
    };
  }

  // ListAccounts retrieves a list of broker accounts.
  // GET /v1/accounts
  rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse) {
    option (sebuf.http.config) = {
      path: "/accounts"
      method: HTTP_METHOD_GET
    };
  }

  // GetAccount retrieves a specific broker account.
  // GET /v1/accounts/{account_id}
  rpc GetAccount(GetBrokerAccountRequest) returns (BrokerAccount) {
    option (sebuf.http.config) = {
      path: "/accounts/{account_id}"
      method: HTTP_METHOD_GET
    };
  }

  // UpdateAccount updates a broker account.
  // PATCH /v1/accounts/{account_id}
  rpc UpdateAccount(UpdateBrokerAccountRequest) returns (BrokerAccount) {
    option (sebuf.http.config) = {
      path: "/accounts/{account_id}"
      method: HTTP_METHOD_PATCH
    };
  }

  // CloseAccount closes a broker account.
  // DELETE /v1/accounts/{account_id}
  rpc CloseAccount(CloseBrokerAccountRequest) returns (CloseBrokerAccountResponse) {
    option (sebuf.http.config) = {
      path: "/accounts/{account_id}"
      method: HTTP_METHOD_DELETE
    };
  }

  // ============================================
  // Trading Account Details Operations
  // ============================================

  // GetTradingAccount retrieves the trading details for a broker account.
  // GET /v1/trading/accounts/{account_id}/account
  rpc GetTradingAccount(GetTradingAccountRequest) returns (TradeAccount) {
    option (sebuf.http.config) = {
      path: "/trading/accounts/{account_id}/account"
      method: HTTP_METHOD_GET
    };
  }

  // ============================================
  // Account Activity Operations
  // ============================================

  // ListAccountActivities retrieves account activities across all accounts.
  // GET /v1/accounts/activities
  rpc ListAccountActivities(ListAccountActivitiesRequest) returns (ListAccountActivitiesResponse) {
    option (sebuf.http.config) = {
      path: "/accounts/activities"
      method: HTTP_METHOD_GET
    };
  }

  // ListAccountActivitiesByType retrieves account activities of a specific type.
  // GET /v1/accounts/activities/{activity_type}
  rpc ListAccountActivitiesByType(ListAccountActivitiesByTypeRequest) returns (ListAccountActivitiesResponse) {
    option (sebuf.http.config) = {
      path: "/accounts/activities/{activity_type}"
      method: HTTP_METHOD_GET
    };
  }

  // ============================================
  // Account Portfolio History Operations
  // ============================================

  // GetBrokerPortfolioHistory retrieves portfolio history for a broker account.
  // GET /v1/trading/accounts/{account_id}/account/portfolio/history
  rpc GetBrokerPortfolioHistory(GetBrokerPortfolioHistoryRequest) returns (BrokerPortfolioHistory) {
    option (sebuf.http.config) = {
      path: "/trading/accounts/{account_id}/account/portfolio/history"
      method: HTTP_METHOD_GET
    };
  }

  // ============================================
  // ACH Relationship Operations
  // ============================================

  // CreateACHRelationship creates an ACH relationship for an account.
  // POST /v1/accounts/{account_id}/ach_relationships
  rpc CreateACHRelationship(CreateACHRelationshipRequest) returns (ACHRelationship) {
    option (sebuf.http.config) = {
      path: "/accounts/{account_id}/ach_relationships"
      method: HTTP_METHOD_POST
    };
  }

  // ListACHRelationships retrieves ACH relationships for an account.
  // GET /v1/accounts/{account_id}/ach_relationships
  rpc ListACHRelationships(ListACHRelationshipsRequest) returns (ListACHRelationshipsResponse) {
    option (sebuf.http.config) = {
      path: "/accounts/{account_id}/ach_relationships"
      method: HTTP_METHOD_GET
    };
  }

  // DeleteACHRelationship deletes an ACH relationship.
  // DELETE /v1/accounts/{account_id}/ach_relationships/{ach_relationship_id}
  rpc DeleteACHRelationship(DeleteACHRelationshipRequest) returns (DeleteACHRelationshipResponse) {
    option (sebuf.http.config) = {
      path: "/accounts/{account_id}/ach_relationships/{ach_relationship_id}"
      method: HTTP_METHOD_DELETE
    };
  }

  // ============================================
  // Transfer Operations
  // ============================================

  // CreateTransfer creates a fund transfer for an account.
  // POST /v1/accounts/{account_id}/transfers
  rpc CreateTransfer(CreateTransferRequest) returns (Transfer) {
    option (sebuf.http.config) = {
      path: "/accounts/{account_id}/transfers"
      method: HTTP_METHOD_POST
    };
  }

  // ListTransfers retrieves transfers for an account.
  // GET /v1/accounts/{account_id}/transfers
  rpc ListTransfers(ListTransfersRequest) returns (ListTransfersResponse) {
    option (sebuf.http.config) = {
      path: "/accounts/{account_id}/transfers"
      method: HTTP_METHOD_GET
    };
  }

  // GetTransfer retrieves a specific transfer.
  // GET /v1/accounts/{account_id}/transfers/{transfer_id}
  rpc GetTransfer(GetTransferRequest) returns (Transfer) {
    option (sebuf.http.config) = {
      path: "/accounts/{account_id}/transfers/{transfer_id}"
      method: HTTP_METHOD_GET
    };
  }

  // CancelTransfer cancels a pending transfer.
  // DELETE /v1/accounts/{account_id}/transfers/{transfer_id}
  rpc CancelTransfer(CancelTransferRequest) returns (CancelTransferResponse) {
    option (sebuf.http.config) = {
      path: "/accounts/{account_id}/transfers/{transfer_id}"
      method: HTTP_METHOD_DELETE
    };
  }

  // ============================================
  // Trading Order Operations
  // ============================================

  // CreateTradingOrder creates a trading order for an account.
  // POST /v1/trading/accounts/{account_id}/orders
  rpc CreateTradingOrder(CreateTradingOrderRequest) returns (BrokerOrder) {
    option (sebuf.http.config) = {
      path: "/trading/accounts/{account_id}/orders"
      method: HTTP_METHOD_POST
    };
  }

  // ListTradingOrders retrieves orders for an account.
  // GET /v1/trading/accounts/{account_id}/orders
  rpc ListTradingOrders(ListTradingOrdersRequest) returns (ListTradingOrdersResponse) {
    option (sebuf.http.config) = {
      path: "/trading/accounts/{account_id}/orders"
      method: HTTP_METHOD_GET
    };
  }

  // GetTradingOrder retrieves a specific order.
  // GET /v1/trading/accounts/{account_id}/orders/{order_id}
  rpc GetTradingOrder(GetTradingOrderRequest) returns (BrokerOrder) {
    option (sebuf.http.config) = {
      path: "/trading/accounts/{account_id}/orders/{order_id}"
      method: HTTP_METHOD_GET
    };
  }

  // CancelTradingOrder cancels an order.
  // DELETE /v1/trading/accounts/{account_id}/orders/{order_id}
  rpc CancelTradingOrder(CancelTradingOrderRequest) returns (CancelTradingOrderResponse) {
    option (sebuf.http.config) = {
      path: "/trading/accounts/{account_id}/orders/{order_id}"
      method: HTTP_METHOD_DELETE
    };
  }

  // ============================================
  // Trading Position Operations
  // ============================================

  // ListTradingPositions retrieves positions for an account.
  // GET /v1/trading/accounts/{account_id}/positions
  rpc ListTradingPositions(ListTradingPositionsRequest) returns (ListTradingPositionsResponse) {
    option (sebuf.http.config) = {
      path: "/trading/accounts/{account_id}/positions"
      method: HTTP_METHOD_GET
    };
  }

  // GetTradingPosition retrieves a specific position.
  // GET /v1/trading/accounts/{account_id}/positions/{symbol}
  rpc GetTradingPosition(GetTradingPositionRequest) returns (BrokerPosition) {
    option (sebuf.http.config) = {
      path: "/trading/accounts/{account_id}/positions/{symbol}"
      method: HTTP_METHOD_GET
    };
  }

  // CloseTradingPosition closes a specific position.
  // DELETE /v1/trading/accounts/{account_id}/positions/{symbol}
  rpc CloseTradingPosition(CloseTradingPositionRequest) returns (BrokerOrder) {
    option (sebuf.http.config) = {
      path: "/trading/accounts/{account_id}/positions/{symbol}"
      method: HTTP_METHOD_DELETE
    };
  }

  // CloseAllTradingPositions closes all positions for an account.
  // DELETE /v1/trading/accounts/{account_id}/positions
  rpc CloseAllTradingPositions(CloseAllTradingPositionsRequest) returns (CloseAllTradingPositionsResponse) {
    option (sebuf.http.config) = {
      path: "/trading/accounts/{account_id}/positions"
      method: HTTP_METHOD_DELETE
    };
  }

  // ============================================
  // Document Operations
  // ============================================

  // ListAccountDocuments retrieves documents for an account.
  // GET /v1/accounts/{account_id}/documents
  rpc ListAccountDocuments(ListAccountDocumentsRequest) returns (ListAccountDocumentsResponse) {
    option (sebuf.http.config) = {
      path: "/accounts/{account_id}/documents"
      method: HTTP_METHOD_GET
    };
  }

  // DownloadAccountDocument downloads an account document.
  // GET /v1/accounts/{account_id}/documents/{document_id}/download
  rpc DownloadAccountDocument(DownloadAccountDocumentRequest) returns (DownloadAccountDocumentResponse) {
    option (sebuf.http.config) = {
      path: "/accounts/{account_id}/documents/{document_id}/download"
      method: HTTP_METHOD_GET
    };
  }

  // DownloadW8BenDocument downloads a W-8BEN document.
  // GET /v1/accounts/{account_id}/documents/w8ben/{document_id}/download
  rpc DownloadW8BenDocument(DownloadW8BenDocumentRequest) returns (DownloadAccountDocumentResponse) {
    option (sebuf.http.config) = {
      path: "/accounts/{account_id}/documents/w8ben/{document_id}/download"
      method: HTTP_METHOD_GET
    };
  }

  // ============================================
  // Broker Watchlist Operations
  // ============================================

  // ListBrokerWatchlists retrieves watchlists for an account.
  // GET /v1/trading/accounts/{account_id}/watchlists
  rpc ListBrokerWatchlists(ListBrokerWatchlistsRequest) returns (ListBrokerWatchlistsResponse) {
    option (sebuf.http.config) = {
      path: "/trading/accounts/{account_id}/watchlists"
      method: HTTP_METHOD_GET
    };
  }

  // CreateBrokerWatchlist creates a watchlist for an account.
  // POST /v1/trading/accounts/{account_id}/watchlists
  rpc CreateBrokerWatchlist(CreateBrokerWatchlistRequest) returns (BrokerWatchlist) {
    option (sebuf.http.config) = {
      path: "/trading/accounts/{account_id}/watchlists"
      method: HTTP_METHOD_POST
    };
  }

  // GetBrokerWatchlist retrieves a specific watchlist.
  // GET /v1/trading/accounts/{account_id}/watchlists/{watchlist_id}
  rpc GetBrokerWatchlist(GetBrokerWatchlistRequest) returns (BrokerWatchlist) {
    option (sebuf.http.config) = {
      path: "/trading/accounts/{account_id}/watchlists/{watchlist_id}"
      method: HTTP_METHOD_GET
    };
  }

  // UpdateBrokerWatchlist updates a watchlist.
  // PUT /v1/trading/accounts/{account_id}/watchlists/{watchlist_id}
  rpc UpdateBrokerWatchlist(UpdateBrokerWatchlistRequest) returns (BrokerWatchlist) {
    option (sebuf.http.config) = {
      path: "/trading/accounts/{account_id}/watchlists/{watchlist_id}"
      method: HTTP_METHOD_PUT
    };
  }

  // DeleteBrokerWatchlist deletes a watchlist.
  // DELETE /v1/trading/accounts/{account_id}/watchlists/{watchlist_id}
  rpc DeleteBrokerWatchlist(DeleteBrokerWatchlistRequest) returns (DeleteBrokerWatchlistResponse) {
    option (sebuf.http.config) = {
      path: "/trading/accounts/{account_id}/watchlists/{watchlist_id}"
      method: HTTP_METHOD_DELETE
    };
  }

  // AddBrokerWatchlistAsset adds an asset to a watchlist.
  // POST /v1/trading/accounts/{account_id}/watchlists/{watchlist_id}
  rpc AddBrokerWatchlistAsset(AddBrokerWatchlistAssetRequest) returns (BrokerWatchlist) {
    option (sebuf.http.config) = {
      path: "/trading/accounts/{account_id}/watchlists/{watchlist_id}"
      method: HTTP_METHOD_POST
    };
  }

  // RemoveBrokerWatchlistAsset removes an asset from a watchlist.
  // DELETE /v1/trading/accounts/{account_id}/watchlists/{watchlist_id}/{symbol}
  rpc RemoveBrokerWatchlistAsset(RemoveBrokerWatchlistAssetRequest) returns (RemoveBrokerWatchlistAssetResponse) {
    option (sebuf.http.config) = {
      path: "/trading/accounts/{account_id}/watchlists/{watchlist_id}/{symbol}"
      method: HTTP_METHOD_DELETE
    };
  }

  // ============================================
  // Broker Crypto Funding Operations
  // ============================================

  // ListBrokerCryptoWallets retrieves crypto wallets for an account.
  // GET /v1/accounts/{account_id}/wallets
  rpc ListBrokerCryptoWallets(ListBrokerCryptoWalletsRequest) returns (ListBrokerCryptoWalletsResponse) {
    option (sebuf.http.config) = {
      path: "/accounts/{account_id}/wallets"
      method: HTTP_METHOD_GET
    };
  }

  // ListBrokerCryptoTransfers retrieves crypto transfers for an account.
  // GET /v1/accounts/{account_id}/wallets/transfers
  rpc ListBrokerCryptoTransfers(ListBrokerCryptoTransfersRequest) returns (ListBrokerCryptoTransfersResponse) {
    option (sebuf.http.config) = {
      path: "/accounts/{account_id}/wallets/transfers"
      method: HTTP_METHOD_GET
    };
  }

  // GetBrokerCryptoTransfer retrieves a specific crypto transfer.
  // GET /v1/accounts/{account_id}/wallets/transfers/{transfer_id}
  rpc GetBrokerCryptoTransfer(GetBrokerCryptoTransferRequest) returns (BrokerCryptoTransfer) {
    option (sebuf.http.config) = {
      path: "/accounts/{account_id}/wallets/transfers/{transfer_id}"
      method: HTTP_METHOD_GET
    };
  }

  // CreateBrokerCryptoTransfer creates a crypto transfer for an account.
  // POST /v1/accounts/{account_id}/wallets/transfers
  rpc CreateBrokerCryptoTransfer(CreateBrokerCryptoTransferRequest) returns (BrokerCryptoTransfer) {
    option (sebuf.http.config) = {
      path: "/accounts/{account_id}/wallets/transfers"
      method: HTTP_METHOD_POST
    };
  }

  // ListBrokerWhitelistedAddresses retrieves whitelisted addresses for an account.
  // GET /v1/accounts/{account_id}/wallets/whitelisted_addresses
  rpc ListBrokerWhitelistedAddresses(ListBrokerWhitelistedAddressesRequest) returns (ListBrokerWhitelistedAddressesResponse) {
    option (sebuf.http.config) = {
      path: "/accounts/{account_id}/wallets/whitelisted_addresses"
      method: HTTP_METHOD_GET
    };
  }

  // CreateBrokerWhitelistedAddress creates a whitelisted address for an account.
  // POST /v1/accounts/{account_id}/wallets/whitelisted_addresses
  rpc CreateBrokerWhitelistedAddress(CreateBrokerWhitelistedAddressRequest) returns (BrokerWhitelistedAddress) {
    option (sebuf.http.config) = {
      path: "/accounts/{account_id}/wallets/whitelisted_addresses"
      method: HTTP_METHOD_POST
    };
  }

  // DeleteBrokerWhitelistedAddress deletes a whitelisted address.
  // DELETE /v1/accounts/{account_id}/wallets/whitelisted_addresses/{whitelisted_address_id}
  rpc DeleteBrokerWhitelistedAddress(DeleteBrokerWhitelistedAddressRequest) returns (DeleteBrokerWhitelistedAddressResponse) {
    option (sebuf.http.config) = {
      path: "/accounts/{account_id}/wallets/whitelisted_addresses/{whitelisted_address_id}"
      method: HTTP_METHOD_DELETE
    };
  }

  // ============================================
  // Journal Operations
  // ============================================

  // CreateJournal creates a journal entry (cash or securities transfer).
  // POST /v1/journals
  rpc CreateJournal(CreateJournalRequest) returns (Journal) {
    option (sebuf.http.config) = {
      path: "/journals"
      method: HTTP_METHOD_POST
    };
  }

  // ListJournals retrieves journal entries.
  // GET /v1/journals
  rpc ListJournals(ListJournalsRequest) returns (ListJournalsResponse) {
    option (sebuf.http.config) = {
      path: "/journals"
      method: HTTP_METHOD_GET
    };
  }

  // GetJournal retrieves a specific journal.
  // GET /v1/journals/{journal_id}
  rpc GetJournal(GetJournalRequest) returns (Journal) {
    option (sebuf.http.config) = {
      path: "/journals/{journal_id}"
      method: HTTP_METHOD_GET
    };
  }

  // DeleteJournal cancels/deletes a journal.
  // DELETE /v1/journals/{journal_id}
  rpc DeleteJournal(DeleteJournalRequest) returns (DeleteJournalResponse) {
    option (sebuf.http.config) = {
      path: "/journals/{journal_id}"
      method: HTTP_METHOD_DELETE
    };
  }

  // CreateBatchJournal creates batch journal entries.
  // POST /v1/journals/batch
  rpc CreateBatchJournal(CreateBatchJournalRequest) returns (CreateBatchJournalResponse) {
    option (sebuf.http.config) = {
      path: "/journals/batch"
