syntax = "proto3";

package alpaca.trading.v1;

import "buf/validate/validate.proto";
import "sebuf/http/annotations.proto";


// Order represents a trading order.
message Order {
  // Order ID (UUID).
  string id = 1 [
    (buf.validate.field).string.uuid = true,
    (sebuf.http.field_examples) = { values: ["61e69015-8549-4bfd-b9c3-01e75843f47d"] }
  ];

  // Client order ID (user-provided).
  string client_order_id = 2 [(sebuf.http.field_examples) = { values: ["my_order_123"] }];

  // Timestamp when the order was created (RFC 3339).
  string created_at = 3 [(sebuf.http.field_examples) = { values: ["2024-01-15T10:30:00Z"] }];

  // Timestamp when the order was last updated.
  string updated_at = 4 [(sebuf.http.field_examples) = { values: ["2024-01-15T10:30:05Z"] }];

  // Timestamp when the order was submitted.
  string submitted_at = 5 [(sebuf.http.field_examples) = { values: ["2024-01-15T10:30:00Z"] }];

  // Timestamp when the order was filled.
  string filled_at = 6 [(sebuf.http.field_examples) = { values: ["2024-01-15T10:30:05Z"] }];

  // Timestamp when the order expired.
  string expired_at = 7;

  // Timestamp when the order was canceled.
  string canceled_at = 8;

  // Timestamp when the order failed.
  string failed_at = 9;

  // Timestamp when the order was replaced.
  string replaced_at = 10;

  // Order ID that replaced this order (optional, UUID format when present).
  string replaced_by = 11 [(sebuf.http.field_examples) = { values: ["71e69015-8549-4bfd-b9c3-01e75843f47d"] }];

  // Order ID that this order replaces (optional, UUID format when present).
  string replaces = 12 [(sebuf.http.field_examples) = { values: ["81e69015-8549-4bfd-b9c3-01e75843f47d"] }];

  // Asset ID.
  string asset_id = 13 [
    (buf.validate.field).string.uuid = true,
    (sebuf.http.field_examples) = { values: ["b0b6dd9d-8b9b-48a9-ba46-b9d54906e415"] }
  ];

  // Asset symbol.
  string symbol = 14 [(sebuf.http.field_examples) = { values: ["AAPL"] }];

  // Asset class.
  string asset_class = 15 [
    (buf.validate.field) = {
      string: {
        in: ["", "us_equity", "crypto", "us_option"]
      }
    },
    (sebuf.http.field_examples) = { values: ["us_equity"] }
  ];

  // Notional value (for fractional orders).
  string notional = 16 [(sebuf.http.field_examples) = { values: ["1000.00"] }];

  // Quantity ordered.
  string qty = 17 [(sebuf.http.field_examples) = { values: ["10"] }];

  // Quantity filled.
  string filled_qty = 18 [(sebuf.http.field_examples) = { values: ["10"] }];

  // Average fill price.
  string filled_avg_price = 19 [(sebuf.http.field_examples) = { values: ["150.25"] }];

  // Order class.
  string order_class = 20 [
    (buf.validate.field) = {
      string: {
        in: ["", "simple", "bracket", "oco", "oto", "mleg"]
      }
    },
    (sebuf.http.field_examples) = { values: ["simple"] }
  ];

  // Order type.
  string order_type = 21 [
    (buf.validate.field) = {
      string: {
        in: ["", "market", "limit", "stop", "stop_limit", "trailing_stop"]
      }
    },
    (sebuf.http.field_examples) = { values: ["limit"] }
  ];

  // Deprecated: use order_type instead.
  string type = 22 [
    (buf.validate.field) = {
      string: {
        in: ["", "market", "limit", "stop", "stop_limit", "trailing_stop"]
      }
    },
    (sebuf.http.field_examples) = { values: ["limit"] }
  ];

  // Order side.
  string side = 23 [
    (buf.validate.field) = {
      string: {
        in: ["", "buy", "sell"]
      }
    },
    (sebuf.http.field_examples) = { values: ["buy"] }
  ];

  // Time in force.
  string time_in_force = 24 [
    (buf.validate.field) = {
      string: {
        in: ["", "day", "gtc", "opg", "cls", "ioc", "fok"]
      }
    },
    (sebuf.http.field_examples) = { values: ["day"] }
  ];

  // Limit price (for limit orders).
  string limit_price = 25 [(sebuf.http.field_examples) = { values: ["150.00"] }];

  // Stop price (for stop orders).
  string stop_price = 26 [(sebuf.http.field_examples) = { values: ["145.00"] }];

  // Order status.
  string status = 27 [
    (buf.validate.field) = {
      string: {
        in: ["", "new", "partially_filled", "filled", "done_for_day", "canceled", "expired", "replaced", "pending_cancel", "pending_replace", "pending_new", "accepted", "accepted_for_bidding", "stopped", "rejected", "suspended", "calculated", "held"]
      }
    },
    (sebuf.http.field_examples) = { values: ["filled"] }
  ];

  // Whether the order is for extended hours.
  bool extended_hours = 28 [(sebuf.http.field_examples) = { values: ["false"] }];

  // Leg orders (for bracket orders).
  repeated Order legs = 29;

  // Trail percent (for trailing stop orders).
  string trail_percent = 30 [(sebuf.http.field_examples) = { values: ["5.0"] }];

  // Trail price (for trailing stop orders).
  string trail_price = 31 [(sebuf.http.field_examples) = { values: ["5.00"] }];

  // High water mark (for trailing stop orders).
  string hwm = 32 [(sebuf.http.field_examples) = { values: ["155.00"] }];

  // Position intent for options orders.
  string position_intent = 33 [
    (buf.validate.field) = {
      string: {
        in: ["", "buy_to_open", "buy_to_close", "sell_to_open", "sell_to_close"]
      }
    },
    (sebuf.http.field_examples) = { values: ["buy_to_open"] }
  ];

  // Subtag for order categorization.
  string subtag = 34 [(sebuf.http.field_examples) = { values: ["mobile"] }];

  // Source of the order.
  string source = 35 [(sebuf.http.field_examples) = { values: ["api"] }];

  // Expiration timestamp for options orders (RFC 3339).
  string expires_at = 36 [(sebuf.http.field_examples) = { values: ["2024-01-19T21:00:00Z"] }];

  // Proportional quantity for multi-leg orders.
  string ratio_qty = 37 [(sebuf.http.field_examples) = { values: ["1"] }];
}
