syntax = "proto3";

package alpaca.trading.v1;

import "buf/validate/validate.proto";
import "sebuf/http/annotations.proto";

// TakeProfitSpec specifies take profit parameters for bracket orders.
message TakeProfitSpec {
  // Limit price for take profit.
  string limit_price = 1 [
    (buf.validate.field).required = true,
    (sebuf.http.field_examples) = { values: ["160.00"] }
  ];
}

// StopLossSpec specifies stop loss parameters for bracket orders.
message StopLossSpec {
  // Stop price for stop loss.
  string stop_price = 1 [
    (buf.validate.field).required = true,
    (sebuf.http.field_examples) = { values: ["140.00"] }
  ];

  // Limit price for stop loss (for stop limit orders).
  string limit_price = 2 [(sebuf.http.field_examples) = { values: ["139.00"] }];
}

// MLegOrderLeg represents an individual leg of a multi-leg options order.
message MLegOrderLeg {
  // Order side (buy or sell).
  string side = 1 [
    (buf.validate.field) = {
      string: {
        in: ["", "buy", "sell"]
      }
    },
    (sebuf.http.field_examples) = { values: ["buy"] }
  ];

  // Position intent for options.
  string position_intent = 2 [
    (buf.validate.field) = {
      string: {
        in: ["", "buy_to_open", "buy_to_close", "sell_to_open", "sell_to_close"]
      }
    },
    (sebuf.http.field_examples) = { values: ["buy_to_open"] }
  ];

  // Symbol or asset ID to identify the asset to trade.
  string symbol = 3 [
    (buf.validate.field).required = true,
    (sebuf.http.field_examples) = { values: ["AAPL241213C00250000"] }
  ];

  // Proportional quantity of this leg in relation to the overall multi-leg order qty.
  string ratio_qty = 4 [
    (buf.validate.field).required = true,
    (sebuf.http.field_examples) = { values: ["1"] }
  ];
}

// AdvancedInstructions provides advanced instructions for Elite Smart Router.
message AdvancedInstructions {
  // The advanced routing algorithm to use (DMA, TWAP, VWAP).
  string algorithm = 1 [(sebuf.http.field_examples) = { values: ["DMA"] }];

  // Target exchange for order execution (NYSE, NASDAQ, ARCA).
  string destination = 2 [(sebuf.http.field_examples) = { values: ["NYSE"] }];

  // Maximum shares/contracts displayed on the exchange at any time.
  string display_qty = 3 [(sebuf.http.field_examples) = { values: ["100"] }];

  // When the algorithm is to start executing (RFC 3339).
  string start_time = 4 [(sebuf.http.field_examples) = { values: ["2025-07-21T09:30:00-04:00"] }];

  // When the algorithm is to be done executing (RFC 3339).
  string end_time = 5 [(sebuf.http.field_examples) = { values: ["2025-07-21T15:30:00-04:00"] }];

  // Maximum percentage of the ticker's period volume (0 < max_percentage < 1).
  string max_percentage = 6 [(sebuf.http.field_examples) = { values: ["0.314"] }];
}

// CreateOrderRequest is the request to create a new order.
message CreateOrderRequest {
  // Symbol or asset ID to trade.
  string symbol = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = { min_len: 1, max_len: 12 },
    (sebuf.http.field_examples) = { values: ["AAPL"] }
  ];

  // Number of shares to trade. Required if notional is not specified.
  string qty = 2 [(sebuf.http.field_examples) = { values: ["10"] }];

  // Dollar amount to trade. Required if qty is not specified.
  string notional = 3 [(sebuf.http.field_examples) = { values: ["1000.00"] }];

  // Order side (buy or sell).
  string side = 4 [
    (buf.validate.field) = {
      string: {
        in: ["buy", "sell"]
      }
    },
    (sebuf.http.field_examples) = { values: ["buy"] }
  ];

  // Order type.
  string type = 5 [
    (buf.validate.field) = {
      string: {
        in: ["market", "limit", "stop", "stop_limit", "trailing_stop"]
      }
    },
    (sebuf.http.field_examples) = { values: ["limit"] }
  ];

  // Time in force.
  string time_in_force = 6 [
    (buf.validate.field) = {
      string: {
        in: ["day", "gtc", "opg", "cls", "ioc", "fok"]
      }
    },
    (sebuf.http.field_examples) = { values: ["day"] }
  ];

  // Limit price (required for limit orders).
  string limit_price = 7 [(sebuf.http.field_examples) = { values: ["150.00"] }];

  // Stop price (required for stop orders).
  string stop_price = 8 [(sebuf.http.field_examples) = { values: ["145.00"] }];

  // Trail price (for trailing stop orders).
  string trail_price = 9 [(sebuf.http.field_examples) = { values: ["5.00"] }];

  // Trail percent (for trailing stop orders).
  string trail_percent = 10 [(sebuf.http.field_examples) = { values: ["5.0"] }];

  // Whether the order is for extended hours.
  bool extended_hours = 11 [(sebuf.http.field_examples) = { values: ["false"] }];

  // Client order ID (user-provided, max 128 characters).
  string client_order_id = 12 [
    (buf.validate.field).string = { max_len: 128 },
    (sebuf.http.field_examples) = { values: ["my_order_123"] }
  ];

  // Order class.
  string order_class = 13 [
    (buf.validate.field) = {
      string: {
        in: ["", "simple", "bracket", "oco", "oto", "mleg"]
      }
    },
    (sebuf.http.field_examples) = { values: ["simple"] }
  ];

  // Take profit spec (for bracket orders).
  TakeProfitSpec take_profit = 14;

  // Stop loss spec (for bracket orders).
  StopLossSpec stop_loss = 15;

  // Position intent for options orders.
  string position_intent = 16 [
    (buf.validate.field) = {
      string: {
        in: ["", "buy_to_open", "buy_to_close", "sell_to_open", "sell_to_close"]
      }
    },
    (sebuf.http.field_examples) = { values: ["buy_to_open"] }
  ];

  // Legs for multi-leg options orders (max 4).
  repeated MLegOrderLeg legs = 17 [(buf.validate.field).repeated = { max_items: 4 }];

  // Advanced instructions for Elite Smart Router.
  AdvancedInstructions advanced_instructions = 18;
}
