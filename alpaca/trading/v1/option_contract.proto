syntax = "proto3";

package alpaca.trading.v1;

import "buf/validate/validate.proto";
import "sebuf/http/annotations.proto";

// OptionContractStatus represents the status of an option contract.
enum OptionContractStatus {
  // option (sebuf.http.enum_encoding) = ENUM_ENCODING_STRING;
  OPTION_CONTRACT_STATUS_UNSPECIFIED = 0;
  OPTION_CONTRACT_STATUS_ACTIVE = 1; // [(sebuf.http.enum_value) = "active"];
  OPTION_CONTRACT_STATUS_INACTIVE = 2; // [(sebuf.http.enum_value) = "inactive"];
}

// OptionContractType represents the type of option contract.
enum OptionContractType {
  // option (sebuf.http.enum_encoding) = ENUM_ENCODING_STRING;
  OPTION_CONTRACT_TYPE_UNSPECIFIED = 0;
  OPTION_CONTRACT_TYPE_CALL = 1; // [(sebuf.http.enum_value) = "call"];
  OPTION_CONTRACT_TYPE_PUT = 2; // [(sebuf.http.enum_value) = "put"];
}

// OptionContractStyle represents the exercise style of an option contract.
enum OptionContractStyle {
  // option (sebuf.http.enum_encoding) = ENUM_ENCODING_STRING;
  OPTION_CONTRACT_STYLE_UNSPECIFIED = 0;
  OPTION_CONTRACT_STYLE_AMERICAN = 1; // [(sebuf.http.enum_value) = "american"];
  OPTION_CONTRACT_STYLE_EUROPEAN = 2; // [(sebuf.http.enum_value) = "european"];
}

// DeliverableType represents the type of deliverable.
enum DeliverableType {
  // option (sebuf.http.enum_encoding) = ENUM_ENCODING_STRING;
  DELIVERABLE_TYPE_UNSPECIFIED = 0;
  DELIVERABLE_TYPE_CASH = 1; // [(sebuf.http.enum_value) = "cash"];
  DELIVERABLE_TYPE_EQUITY = 2; // [(sebuf.http.enum_value) = "equity"];
}

// SettlementType represents when the deliverable will be settled.
enum SettlementType {
  // option (sebuf.http.enum_encoding) = ENUM_ENCODING_STRING;
  SETTLEMENT_TYPE_UNSPECIFIED = 0;
  SETTLEMENT_TYPE_T0 = 1; // [(sebuf.http.enum_value) = "T+0"];
  SETTLEMENT_TYPE_T1 = 2; // [(sebuf.http.enum_value) = "T+1"];
  SETTLEMENT_TYPE_T2 = 3; // [(sebuf.http.enum_value) = "T+2"];
  SETTLEMENT_TYPE_T3 = 4; // [(sebuf.http.enum_value) = "T+3"];
  SETTLEMENT_TYPE_T4 = 5; // [(sebuf.http.enum_value) = "T+4"];
  SETTLEMENT_TYPE_T5 = 6; // [(sebuf.http.enum_value) = "T+5"];
}

// SettlementMethod represents the settlement method.
enum SettlementMethod {
  // option (sebuf.http.enum_encoding) = ENUM_ENCODING_STRING;
  SETTLEMENT_METHOD_UNSPECIFIED = 0;
  SETTLEMENT_METHOD_BTOB = 1; // [(sebuf.http.enum_value) = "BTOB"];
  SETTLEMENT_METHOD_CADF = 2; // [(sebuf.http.enum_value) = "CADF"];
  SETTLEMENT_METHOD_CAFX = 3; // [(sebuf.http.enum_value) = "CAFX"];
  SETTLEMENT_METHOD_CCC = 4; // [(sebuf.http.enum_value) = "CCC"];
}

// OptionDeliverable represents a deliverable tied to an option contract.
message OptionDeliverable {
  // Type of deliverable, indicating whether it's cash or equity.
  string type = 1 [(sebuf.http.field_examples) = { values: ["equity"] }];

  // Symbol of the deliverable.
  string symbol = 2 [(sebuf.http.field_examples) = { values: ["AAPL"] }];

  // Unique identifier of the deliverable asset.
  string asset_id = 3 [(sebuf.http.field_examples) = { values: ["b0b6dd9d-8b9b-48a9-ba46-b9d54906e415"] }];

  // The deliverable amount.
  string amount = 4 [(sebuf.http.field_examples) = { values: ["100"] }];

  // Cost allocation percentage of the deliverable.
  string allocation_percentage = 5 [(sebuf.http.field_examples) = { values: ["100"] }];

  // Indicates when the deliverable will be settled if the contract is exercised/assigned.
  string settlement_type = 6 [(sebuf.http.field_examples) = { values: ["T+2"] }];

  // Indicates the settlement method that will be used.
  string settlement_method = 7 [(sebuf.http.field_examples) = { values: ["CCC"] }];

  // If true, the settlement of the deliverable will be delayed.
  bool delayed_settlement = 8 [(sebuf.http.field_examples) = { values: ["false"] }];
}

// OptionContract represents an option contract.
message OptionContract {
  // The unique identifier of the option contract.
  string id = 1 [(sebuf.http.field_examples) = { values: ["98359ef7-5124-49f3-85ea-5cf02df6defa"] }];

  // The symbol representing the option contract.
  string symbol = 2 [(sebuf.http.field_examples) = { values: ["AAPL250620C00100000"] }];

  // The name of the option contract.
  string name = 3 [(sebuf.http.field_examples) = { values: ["AAPL Jun 20 2025 100 Call"] }];

  // The status of the option contract.
  string status = 4 [(sebuf.http.field_examples) = { values: ["active"] }];

  // Indicates whether the option contract is tradable.
  bool tradable = 5 [(sebuf.http.field_examples) = { values: ["true"] }];

  // The expiration date of the option contract.
  string expiration_date = 6 [(sebuf.http.field_examples) = { values: ["2025-06-20"] }];

  // The root symbol of the option contract.
  string root_symbol = 7 [(sebuf.http.field_examples) = { values: ["AAPL"] }];

  // The underlying symbol of the option contract.
  string underlying_symbol = 8 [(sebuf.http.field_examples) = { values: ["AAPL"] }];

  // The unique identifier of the underlying asset.
  string underlying_asset_id = 9 [(sebuf.http.field_examples) = { values: ["b0b6dd9d-8b9b-48a9-ba46-b9d54906e415"] }];

  // The type of the option contract (call or put).
  string type = 10 [(sebuf.http.field_examples) = { values: ["call"] }];

  // The style of the option contract (american or european).
  string style = 11 [(sebuf.http.field_examples) = { values: ["american"] }];

  // The strike price of the option contract.
  string strike_price = 12 [(sebuf.http.field_examples) = { values: ["100"] }];

  // The multiplier of the option contract.
  string multiplier = 13 [(sebuf.http.field_examples) = { values: ["100"] }];

  // Represents the number of underlying shares to be delivered in case the contract is exercised/assigned.
  string size = 14 [(sebuf.http.field_examples) = { values: ["100"] }];

  // The open interest of the option contract.
  string open_interest = 15 [(sebuf.http.field_examples) = { values: ["237"] }];

  // The date of the open interest data.
  string open_interest_date = 16 [(sebuf.http.field_examples) = { values: ["2023-12-11"] }];

  // The close price of the option contract.
  string close_price = 17 [(sebuf.http.field_examples) = { values: ["148.38"] }];

  // The date of the close price data.
  string close_price_date = 18 [(sebuf.http.field_examples) = { values: ["2023-12-11"] }];

  // Represents the deliverables tied to the option contract.
  repeated OptionDeliverable deliverables = 19;
}

// ListOptionContractsRequest is the request to list option contracts.
message ListOptionContractsRequest {
  // Filter contracts by one or more underlying symbols.
  string underlying_symbols = 1 [
    (sebuf.http.query) = { name: "underlying_symbols" },
    (sebuf.http.field_examples) = { values: ["AAPL,SPY"] }
  ];

  // Include deliverables array in the response.
  bool show_deliverables = 2 [
    (sebuf.http.query) = { name: "show_deliverables" },
    (sebuf.http.field_examples) = { values: ["true"] }
  ];

  // Filter contracts by status (active/inactive).
  string status = 3 [
    (sebuf.http.query) = { name: "status" },
    (sebuf.http.field_examples) = { values: ["active"] }
  ];

  // Filter contracts by the exact expiration date (format: YYYY-MM-DD).
  string expiration_date = 4 [
    (sebuf.http.query) = { name: "expiration_date" },
    (sebuf.http.field_examples) = { values: ["2025-06-20"] }
  ];

  // Filter contracts with expiration date greater than or equal to the specified date.
  string expiration_date_gte = 5 [
    (sebuf.http.query) = { name: "expiration_date_gte" },
    (sebuf.http.field_examples) = { values: ["2025-06-20"] }
  ];

  // Filter contracts with expiration date less than or equal to the specified date.
  string expiration_date_lte = 6 [
    (sebuf.http.query) = { name: "expiration_date_lte" },
    (sebuf.http.field_examples) = { values: ["2025-06-20"] }
  ];

  // Filter contracts by the root symbol.
  string root_symbol = 7 [
    (sebuf.http.query) = { name: "root_symbol" },
    (sebuf.http.field_examples) = { values: ["AAPL"] }
  ];

  // Filter contracts by the type (call/put).
  string type = 8 [
    (sebuf.http.query) = { name: "type" },
    (sebuf.http.field_examples) = { values: ["call"] }
  ];

  // Filter contracts by the style (american/european).
  string style = 9 [
    (sebuf.http.query) = { name: "style" },
    (sebuf.http.field_examples) = { values: ["american"] }
  ];

  // Filter contracts with strike price greater than or equal to the specified value.
  string strike_price_gte = 10 [
    (sebuf.http.query) = { name: "strike_price_gte" },
    (sebuf.http.field_examples) = { values: ["50"] }
  ];

  // Filter contracts with strike price less than or equal to the specified value.
  string strike_price_lte = 11 [
    (sebuf.http.query) = { name: "strike_price_lte" },
    (sebuf.http.field_examples) = { values: ["100"] }
  ];

  // Pagination token for the next page.
  string page_token = 12 [
    (sebuf.http.query) = { name: "page_token" },
    (sebuf.http.field_examples) = { values: ["MA=="] }
  ];

  // The number of contracts to limit per page (default=100, max=10000).
  int32 limit = 13 [
    (sebuf.http.query) = { name: "limit" },
    (buf.validate.field).int32 = { gte: 1, lte: 10000 },
    (sebuf.http.field_examples) = { values: ["100"] }
  ];

  // The Penny Program Indicator field indicates whether an option contract is eligible for penny price increments.
  bool ppind = 14 [
    (sebuf.http.query) = { name: "ppind" },
    (sebuf.http.field_examples) = { values: ["true"] }
  ];
}

// ListOptionContractsResponse is the response containing a list of option contracts.
message ListOptionContractsResponse {
  // List of option contracts.
  repeated OptionContract option_contracts = 1;

  // Pagination token for the next page.
  string next_page_token = 2 [(sebuf.http.field_examples) = { values: ["MTAwMA=="] }];
}

// GetOptionContractRequest is the request to get a specific option contract.
message GetOptionContractRequest {
  // The symbol or contract ID (required).
  string symbol_or_id = 1 [
    (buf.validate.field).required = true,
    (sebuf.http.field_examples) = { values: ["AAPL250620C00100000"] }
  ];
}
